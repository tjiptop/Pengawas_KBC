<script>
// ============================================================
// KANBAN BOARD CLIENT-SIDE MODULE
// ============================================================

const KanbanView = {
  skeleton: () => {
    return `
    <div class="header no-print">
      <div style="display:flex;align-items:center;gap:12px;width:100%;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="header-page-icon">🎯</div>
          <div>
            <h1 style="margin:0;font-size:0.95rem;line-height:1.2;font-weight:700;">Program Kerja</h1>
            <div class="skeleton" style="width:120px;height:12px;margin-top:2px;"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="skeleton" style="width:34px;height:30px;border-radius:6px;"></div>
          <div class="skeleton" style="width:75px;height:30px;border-radius:6px;"></div>
          <div class="skeleton" style="width:85px;height:30px;border-radius:6px;"></div>
        </div>
      </div>
    </div>
    <div class="content" style="max-width: 100%; width: 100%; overflow: hidden;">
      <div style="display:flex;gap:16px;height:calc(100vh - 180px);overflow-x:auto;padding-bottom:15px;">
        <div class="kanban-column" style="height:100%;"><div class="kanban-column-header"><div class="skeleton" style="width:80px;height:14px;"></div></div><div class="kanban-card-list"><div class="skeleton" style="height:80px;margin-bottom:10px;"></div><div class="skeleton" style="height:80px;"></div></div></div>
        <div class="kanban-column" style="height:100%;"><div class="kanban-column-header"><div class="skeleton" style="width:80px;height:14px;"></div></div><div class="kanban-card-list"></div></div>
        <div class="kanban-column" style="height:100%;"><div class="kanban-column-header"><div class="skeleton" style="width:80px;height:14px;"></div></div><div class="kanban-card-list"></div></div>
      </div>
    </div>`;
  },

  getStageColorClass(stage) {
    if (stage === 'Belum Mulai') return 'indicator-todo';
    if (stage === 'Sedang Berjalan') return 'indicator-proses';
    if (stage === 'Selesai') return 'indicator-selesai';
    return 'indicator-dibatalkan';
  },

  /**
   * Render tag icons html based on configured tag definitions
   */
  renderTagIconsHtml(cardTags, fontSize = '0.82rem', padding = '2px') {
    const tagIconMap = {};
    const catFallbackIcons = {
      'KBC': '🧩',
      'Level': '📈'
    };

    (KanbanManager.state.tags || []).forEach(t => {
      const parts = t.split('|');
      const cat = parts[0] || '';
      const sub = parts[1] || '';
      const icon = parts[2] || '';
      if (cat && sub) {
        tagIconMap[`${cat}|${sub}`.toLowerCase()] = icon;
      }
    });

    const groups = {};
    cardTags.forEach(t => {
      const parts = t.split('|');
      const cat = parts[0] || 'Lainnya';
      const sub = parts[1] || t;
      
      const key = `${cat}|${sub}`.toLowerCase();
      const icon = tagIconMap[key] || catFallbackIcons[cat] || '🏷️';
      const iconHtml = `<span style="cursor:default; font-size:${fontSize}; padding: ${padding}; display:inline-flex; align-items:center;" title="${cat}: ${sub}">${icon}</span>`;
      
      if (!groups[cat]) {
        groups[cat] = [];
      }
      groups[cat].push(iconHtml);
    });

    const categoryStrings = [];
    for (const cat in groups) {
      categoryStrings.push(groups[cat].join(''));
    }

    return categoryStrings.join('<span style="color:#ccc; margin: 0 4px; font-size:0.75rem; user-select:none;">|</span>');
  },

  /**
   * Main Board View
   */
  main: (madrasahName, cards, comments) => {
    const isSupervisor = !!App.state.isSupervisorViewAs;
    
    // Status columns mapping
    const columns = [
      { id: 'Belum Mulai', title: 'Belum Mulai', colorClass: 'indicator-todo' },
      { id: 'Sedang Berjalan', title: 'Sedang Berjalan', colorClass: 'indicator-proses' },
      { id: 'Selesai', title: 'Selesai', colorClass: 'indicator-selesai' }
    ];

    // Group cards by status
    const cardsByStatus = { 'Belum Mulai': [], 'Sedang Berjalan': [], 'Selesai': [], 'Dibatalkan': [] };
    cards.forEach(c => {
      if (cardsByStatus[c.status] !== undefined) {
        cardsByStatus[c.status].push(c);
      } else {
        cardsByStatus['Belum Mulai'].push(c); // Fallback
      }
    });

    let boardColumnsHtml = columns.map(col => {
      const colCards = cardsByStatus[col.id];
      
      const cardsHtml = colCards.map(card => {
        // Calculate unread comments count for this card
        const cardComments = comments.filter(comm => comm.card_id === card.card_id && comm.author_role !== 'System');
        const meId = String(isSupervisor ? App.state.user?.NIP : App.state.kamad?.nsm).trim();
        let unreadComments = 0;
        
        cardComments.forEach(comm => {
          if (String(comm.author_id).trim() !== meId) {
            const lastSeenTime = localStorage.getItem(`kanban_card_last_seen_${card.card_id}`) || '0';
            if (new Date(comm.created_at).getTime() > new Date(lastSeenTime).getTime()) {
              unreadComments++;
            }
          }
        });

        const cardTags = card.tag ? card.tag.split(',').map(s => s.trim()).filter(Boolean) : [];
        const tagIconsHtml = KanbanView.renderTagIconsHtml(cardTags, '0.82rem', '2px');

        // 1. Links row (open directly in new tab)
        const links = (card.attachments || []).filter(att => att.type === 'link');
        let linksHtml = '';
        if (links.length > 0) {
          linksHtml = `<div class="kanban-card-links" style="display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-bottom:4px;">`;
          links.forEach(att => {
            const title = att.name || 'Tautan';
            let displayTitle = title;
            if (displayTitle.length > 35) {
              displayTitle = displayTitle.substring(0, 35) + '...';
            }
            linksHtml += `
              <a href="${att.url}" target="_blank" class="kanban-badge-item badge-link" onclick="event.stopPropagation();" title="${title}" style="text-decoration:none; display:inline-flex; align-items:center; cursor:pointer; background:rgba(0,0,0,0.05); padding:2px 6px; border-radius:4px; font-size:0.75rem; color:var(--color-text); max-width:280px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">
                🔗 <span style="margin-left:4px;">${displayTitle}</span>
              </a>
            `;
          });
          linksHtml += `</div>`;
        }

        // 2. Stage-bound items (Files & Notes)
        const stageItemsByStatus = { 'Belum Mulai': [], 'Sedang Berjalan': [], 'Selesai': [], 'Dibatalkan': [] };
        (card.attachments || []).forEach(att => {
          if (att.type !== 'link') {
            const status = att.card_status || 'Belum Mulai';
            if (stageItemsByStatus[status] !== undefined) {
              stageItemsByStatus[status].push({ type: 'file', data: att });
            }
          }
        });
        (card.work_notes || []).forEach(note => {
          const status = note.card_status || 'Belum Mulai';
          if (stageItemsByStatus[status] !== undefined) {
            stageItemsByStatus[status].push({ type: 'note', data: note });
          }
        });

        let stageRowsHtml = '';
        const stagesList = ['Belum Mulai', 'Sedang Berjalan', 'Selesai', 'Dibatalkan'];
        stagesList.forEach(stg => {
          const items = stageItemsByStatus[stg];
          if (items && items.length > 0) {
            let iconsHtml = '';
            items.forEach(item => {
              if (item.type === 'file') {
                const att = item.data;
                let icon = '📎';
                let title = (att.name || 'Lampiran').replace(/"/g, '&quot;');
                let badgeClass = 'badge-link';
                if (att.type === 'image') { icon = '🖼️'; badgeClass = 'badge-image'; }
                else if (att.type === 'pdf') { icon = '📄'; badgeClass = 'badge-pdf'; }

                const attIndex = card.attachments.indexOf(att);
                iconsHtml += `
                  <span class="kanban-badge-item ${badgeClass}" onclick="event.stopPropagation(); KanbanManager.previewAttachmentByIndex('${card.card_id}', ${attIndex})" title="${title}" style="display:inline-flex; align-items:center; cursor:pointer; margin-right:2px;">
                    ${icon}
                  </span>
                `;
              } else if (item.type === 'note') {
                const note = item.data;
                iconsHtml += `
                  <span class="kanban-badge-item badge-note" onclick="event.stopPropagation(); KanbanManager.previewDetailedNoteById('${card.card_id}', '${note.note_id}')" title="Catatan Rincian" style="display:inline-flex; align-items:center; cursor:pointer; background:#fff3cd; border:1px solid #ffeeba; color:#856404; font-size:0.75rem; padding:1px 4px; border-radius:3px; margin-right:2px;">
                    📝
                  </span>
                `;
              }
            });

            if (iconsHtml) {
              if (stageRowsHtml) {
                stageRowsHtml += `<hr style="margin: 4px 0; border: none; border-top: 1px dashed rgba(0,0,0,0.08); width: 100%;">`;
              }
              stageRowsHtml += `
                <div style="display:flex; align-items:center; gap:6px; font-size:0.68rem; flex-wrap:wrap;">
                  <span style="display:inline-flex; align-items:center; gap:4px; font-weight:700; color:var(--color-text-secondary); opacity:0.85;">
                    <span class="kanban-indicator ${KanbanView.getStageColorClass(stg)}" style="width:7px; height:7px; display:inline-block; flex-shrink:0;"></span>
                    ${stg}:
                  </span>
                  <div style="display:flex; align-items:center; gap:2px;">${iconsHtml}</div>
                </div>
              `;
            }
          }
        });

        let groupsContainerHtml = '';
        if (linksHtml || stageRowsHtml) {
          const dividerHtml = (stageRowsHtml && linksHtml)
            ? `<hr style="margin: 4px 0; border: none; border-top: 1px dashed rgba(0,0,0,0.08); width: 100%;">`
            : '';
          groupsContainerHtml = `
            <div class="kanban-groups-container" style="background:rgba(0,0,0,0.02); padding:6px 8px; border-radius:6px; margin-top:8px; border:1px solid rgba(0,0,0,0.04); text-align:left;">
              ${stageRowsHtml}
              ${dividerHtml}
              ${linksHtml}
            </div>
          `;
        }

        return `
          <div class="kanban-card" 
               id="${card.card_id}" 
               draggable="${!isSupervisor}"
               ondragstart="KanbanManager.onDragStart(event)"
               onclick="KanbanManager.openCardModal('${card.card_id}')">
            ${card.approved_by_supervisor ? `
              <div style="background:rgba(16, 185, 129, 0.1); color:rgb(16, 185, 129); font-size:0.65rem; font-weight:700; padding:2px 6px; border-radius:4px; margin-bottom:8px; display:inline-block; border:1px solid rgba(16, 185, 129, 0.2);">
                ✅ Disahkan Pengawas
              </div>
            ` : ''}
            ${card.delete_requested ? `
              <div style="background:rgba(239, 68, 68, 0.1); color:rgb(239, 68, 68); font-size:0.65rem; font-weight:700; padding:2px 6px; border-radius:4px; margin-bottom:8px; display:inline-block; border:1px solid rgba(239, 68, 68, 0.2);">
                ⚠️ Pengajuan Hapus
              </div>
            ` : ''}
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <div style="flex:1; display:flex; flex-direction:column; gap:2px; text-align:left; overflow:hidden;">
                <h4 class="kanban-card-title-text" style="margin:0; width:100%;">${card.title}</h4>
                ${card.tgl_selesai ? `
                  <span style="font-size:0.62rem; color:#d93025; font-weight:600; display:inline-flex; align-items:center; gap:3px; margin-top:2px;">
                    📅 Target: ${(() => {
                      const parts = card.tgl_selesai.split('-');
                      if (parts.length === 3) {
                        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                        const day = parts[2];
                        const month = months[parseInt(parts[1], 10) - 1] || '';
                        const year = parts[0];
                        return `${year} ${month} ${day}`;
                      }
                      return card.tgl_selesai;
                    })()}
                  </span>
                ` : ''}
              </div>
              <div style="display:flex; align-items:center; gap:6px; flex-shrink:0; margin-top:2px;">
                <!-- Tombol + untuk Quick Add (Catatan / Lampiran) -->
                <span class="kanban-badge-item quick-add-btn" onclick="event.stopPropagation(); KanbanManager.openQuickAddModal('${card.card_id}')" style="cursor:pointer; background:#e6f4ea; color:#137333; font-weight:bold; border-radius:50%; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; font-size:0.8rem; border:1px solid rgba(19,115,51,0.2);" title="Tambah Catatan atau Lampiran">
                  ＋
                </span>
                <!-- Komentar badge dengan pulsing red dot jika unread -->
                <span style="font-size:0.88rem; font-weight:700; padding:2px 6px; display:inline-flex; align-items:center; gap:4px; position:relative; background:transparent; border:none;" title="${cardComments.length} diskusi">
                  💬 ${cardComments.length}
                  ${unreadComments > 0 ? `<span class="kanban-unread-dot" style="top: 0px; right: 0px;"></span>` : ''}
                </span>
              </div>
            </div>
            ${card.description ? `<p class="kanban-card-desc-text">${card.description}</p>` : ''}
            
            ${groupsContainerHtml}
            
            <div class="kanban-card-meta" style="margin-top: 8px; display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:0.65rem; color:var(--color-text-secondary);">${Utils.formatTimeAgo(card.updated_at)}</span>
              ${cardTags.length > 0 ? `<div style="display:flex; gap:2px; align-items:center; margin-left:auto;">${tagIconsHtml}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="kanban-column" 
             id="col-${col.id}"
             ondragover="KanbanManager.onDragOver(event)"
             ondragleave="KanbanManager.onDragLeave(event)"
             ondrop="KanbanManager.onDrop(event, '${col.id}')">
          <div class="kanban-column-header">
            <div class="kanban-column-title-wrapper">
              <span class="kanban-indicator ${col.colorClass}"></span>
              <h3 class="kanban-column-title">${col.title}</h3>
            </div>
            <span class="kanban-column-counter">${colCards.length}</span>
          </div>
          <div class="kanban-card-list" id="list-${col.id}">
            ${cardsHtml || `
              <div style="text-align:center;padding:30px 10px;color:var(--color-text-light);font-size:0.75rem;border:1px dashed rgba(0,0,0,0.05);border-radius:var(--radius-md);margin-top:10px;">
                Belum ada kartu
              </div>
            `}
          </div>
        </div>
      `;
    }).join('');

    // Generate Dibatalkan bottom section
    const cancelledCol = { id: 'Dibatalkan', title: 'Ditunda', colorClass: 'indicator-dibatalkan' };
    const cancelledCards = cardsByStatus['Dibatalkan'] || [];
    
    const cancelledCardsHtml = cancelledCards.map(card => {
      const cardComments = comments.filter(comm => comm.card_id === card.card_id && comm.author_role !== 'System');
      const meId = String(isSupervisor ? App.state.user?.NIP : App.state.kamad?.nsm).trim();
      let unreadComments = 0;
      cardComments.forEach(comm => {
        if (String(comm.author_id).trim() !== meId) {
          const lastSeenTime = localStorage.getItem(`kanban_card_last_seen_${card.card_id}`) || '0';
          if (new Date(comm.created_at).getTime() > new Date(lastSeenTime).getTime()) {
            unreadComments++;
          }
        }
      });

      const cardTags = card.tag ? card.tag.split(',').map(s => s.trim()).filter(Boolean) : [];
      const tagIconsHtml = KanbanView.renderTagIconsHtml(cardTags, '0.7rem', '1px');

      // 1. Links row for cancelled
      const links = (card.attachments || []).filter(att => att.type === 'link');
      let linksHtml = '';
      if (links.length > 0) {
        linksHtml = `<div class="kanban-card-links" style="display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-bottom:4px;">`;
        links.forEach(att => {
          const title = att.name || 'Tautan';
          let displayTitle = title;
          if (displayTitle.length > 35) {
            displayTitle = displayTitle.substring(0, 35) + '...';
          }
          linksHtml += `
            <a href="${att.url}" target="_blank" class="kanban-badge-item badge-link" onclick="event.stopPropagation();" title="${title}" style="text-decoration:none; display:inline-flex; align-items:center; cursor:pointer; background:rgba(0,0,0,0.05); padding:2px 6px; border-radius:4px; font-size:0.75rem; color:var(--color-text); max-width:280px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">
              🔗 <span style="margin-left:4px;">${displayTitle}</span>
            </a>
          `;
        });
        linksHtml += `</div>`;
      }

      // 2. Stage items for cancelled
      const stageItemsByStatus = { 'Belum Mulai': [], 'Sedang Berjalan': [], 'Selesai': [], 'Dibatalkan': [] };
      (card.attachments || []).forEach(att => {
        if (att.type !== 'link') {
          const status = att.card_status || 'Belum Mulai';
          if (stageItemsByStatus[status] !== undefined) {
            stageItemsByStatus[status].push({ type: 'file', data: att });
          }
        }
      });
      (card.work_notes || []).forEach(note => {
        const status = note.card_status || 'Belum Mulai';
        if (stageItemsByStatus[status] !== undefined) {
          stageItemsByStatus[status].push({ type: 'note', data: note });
        }
      });

      let stageRowsHtml = '';
      const stagesList = ['Belum Mulai', 'Sedang Berjalan', 'Selesai', 'Dibatalkan'];
      stagesList.forEach(stg => {
        const items = stageItemsByStatus[stg];
        if (items && items.length > 0) {
          let iconsHtml = '';
          items.forEach(item => {
            if (item.type === 'file') {
              const att = item.data;
              let icon = '📎';
              let title = (att.name || 'Lampiran').replace(/"/g, '&quot;');
              let badgeClass = 'badge-link';
              if (att.type === 'image') { icon = '🖼️'; badgeClass = 'badge-image'; }
              else if (att.type === 'pdf') { icon = '📄'; badgeClass = 'badge-pdf'; }

              const attIndex = card.attachments.indexOf(att);
              iconsHtml += `
                <span class="kanban-badge-item ${badgeClass}" onclick="event.stopPropagation(); KanbanManager.previewAttachmentByIndex('${card.card_id}', ${attIndex})" title="${title}" style="display:inline-flex; align-items:center; cursor:pointer; margin-right:2px;">
                  ${icon}
                </span>
              `;
            } else if (item.type === 'note') {
              const note = item.data;
              iconsHtml += `
                <span class="kanban-badge-item badge-note" onclick="event.stopPropagation(); KanbanManager.previewDetailedNoteById('${card.card_id}', '${note.note_id}')" title="Catatan Rincian" style="display:inline-flex; align-items:center; cursor:pointer; background:#fff3cd; border:1px solid #ffeeba; color:#856404; font-size:0.7rem; padding:1px 3px; border-radius:3px; margin-right:2px;">
                  📝
                </span>
              `;
            }
          });

          if (iconsHtml) {
            if (stageRowsHtml) {
              stageRowsHtml += `<hr style="margin: 3px 0; border: none; border-top: 1px dashed rgba(0,0,0,0.08); width: 100%;">`;
            }
            stageRowsHtml += `
              <div style="display:flex; align-items:center; gap:6px; font-size:0.62rem; flex-wrap:wrap;">
                <span style="display:inline-flex; align-items:center; gap:4px; font-weight:700; color:var(--color-text-secondary); opacity:0.85;">
                  <span class="kanban-indicator ${KanbanView.getStageColorClass(stg)}" style="width:7px; height:7px; display:inline-block; flex-shrink:0;"></span>
                  ${stg}:
                </span>
                <div style="display:flex; align-items:center; gap:2px;">${iconsHtml}</div>
              </div>
            `;
          }
        }
      });

      let groupsContainerHtml = '';
      if (linksHtml || stageRowsHtml) {
        const dividerHtml = (stageRowsHtml && linksHtml)
          ? `<hr style="margin: 3px 0; border: none; border-top: 1px dashed rgba(0,0,0,0.08); width: 100%;">`
          : '';
        groupsContainerHtml = `
          <div class="kanban-groups-container" style="background:rgba(0,0,0,0.02); padding:4px 6px; border-radius:6px; margin-top:6px; border:1px solid rgba(0,0,0,0.04); width:100%; text-align:left;">
            ${stageRowsHtml}
            ${dividerHtml}
            ${linksHtml}
          </div>
        `;
      }

      return `
        <div class="kanban-card" 
             id="${card.card_id}" 
             draggable="${!isSupervisor}"
             ondragstart="KanbanManager.onDragStart(event)"
             onclick="KanbanManager.openCardModal('${card.card_id}')"
             style="flex: 0 0 260px; max-width: 260px; cursor: grab; padding: var(--spacing-sm); gap: var(--spacing-xs);">
          ${card.approved_by_supervisor ? `
            <div style="background:rgba(16, 185, 129, 0.1); color:rgb(16, 185, 129); font-size:0.58rem; font-weight:700; padding:1px 4px; border-radius:4px; margin-bottom:4px; display:inline-block; border:1px solid rgba(16, 185, 129, 0.2);">
              ✅ Disahkan Pengawas
            </div>
          ` : ''}
          ${card.delete_requested ? `
            <div style="background:rgba(239, 68, 68, 0.1); color:rgb(239, 68, 68); font-size:0.58rem; font-weight:700; padding:1px 4px; border-radius:4px; margin-bottom:4px; display:inline-block; border:1px solid rgba(239, 68, 68, 0.2);">
              ⚠️ Pengajuan Hapus
            </div>
          ` : ''}
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div style="flex:1; display:flex; flex-direction:column; gap:2px; text-align:left; overflow:hidden;">
              <h4 class="kanban-card-title-text" style="font-size:0.75rem; text-decoration: line-through; opacity: 0.65; margin:0; width:100%;">${card.title}</h4>
              ${card.tgl_selesai ? `
                <span style="font-size:0.58rem; color:#d93025; font-weight:600; display:inline-flex; align-items:center; gap:2px; margin-top:1px;">
                  📅 Target: ${(() => {
                    const parts = card.tgl_selesai.split('-');
                    if (parts.length === 3) {
                      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                      const day = parts[2];
                      const month = months[parseInt(parts[1], 10) - 1] || '';
                      const year = parts[0];
                      return `${year} ${month} ${day}`;
                    }
                    return card.tgl_selesai;
                  })()}
                </span>
              ` : ''}
            </div>
            <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
              <!-- Tombol + untuk Quick Add (Catatan / Lampiran) -->
              <span class="kanban-badge-item quick-add-btn" onclick="event.stopPropagation(); KanbanManager.openQuickAddModal('${card.card_id}')" style="cursor:pointer; background:#e6f4ea; color:#137333; font-weight:bold; border-radius:50%; width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; font-size:0.65rem; border:1px solid rgba(19,115,51,0.2);" title="Tambah Catatan atau Lampiran">
                ＋
              </span>

  /**
   * Modal Content (Card Details & Comment Box)
   */
  modalContent: (card, comments) => {
    const isSupervisor = !!App.state.isSupervisorViewAs;
    const isDeleteRequested = !!card.delete_requested;
    const isApproved = !!card.approved_by_supervisor;
    const editable = !isSupervisor && !isDeleteRequested && !isApproved;

    const notesOpen = (KanbanManager.state.accordions && KanbanManager.state.accordions.notes) ? 'open' : '';
    const notesStyle = (KanbanManager.state.accordions && KanbanManager.state.accordions.notes) ? 'display: block;' : 'display: none;';
    
    const attachmentsOpen = (KanbanManager.state.accordions && KanbanManager.state.accordions.attachments) ? 'open' : '';
    const attachmentsStyle = (KanbanManager.state.accordions && KanbanManager.state.accordions.attachments) ? 'display: block;' : 'display: none;';

    const linksOpen = (KanbanManager.state.accordions && KanbanManager.state.accordions.links) ? 'open' : '';
    const linksStyle = (KanbanManager.state.accordions && KanbanManager.state.accordions.links) ? 'display: block;' : 'display: none;';

    let alertBannerHtml = '';
    if (isApproved) {
      alertBannerHtml = `
        <div style="background:rgba(16, 185, 129, 0.08); color:rgb(16, 185, 129); font-size:0.8rem; font-weight:600; padding:12px 14px; border-radius:8px; margin-bottom:16px; border:1px solid rgba(16, 185, 129, 0.2); display:flex; align-items:center; gap:8px;">
          <span style="font-size:1.1rem; line-height:1;">✅</span>
          <span>Penyelesaian tugas ini telah disetujui dan disahkan oleh Pengawas Binaan.</span>
        </div>
      `;
    } else if (isDeleteRequested) {
      if (isSupervisor) {
        alertBannerHtml = `
          <div style="background:rgba(239, 68, 68, 0.08); color:rgb(239, 68, 68); font-size:0.8rem; font-weight:600; padding:12px 14px; border-radius:8px; margin-bottom:16px; border:1px solid rgba(239, 68, 68, 0.2); display:flex; align-items:center; gap:8px;">
            <span style="font-size:1.1rem; line-height:1;">⚠️</span>
            <span>Kepala Madrasah mengajukan permohonan penghapusan kartu ini. Silakan berikan keputusan Anda.</span>
          </div>
        `;
      } else {
        alertBannerHtml = `
          <div style="background:rgba(245, 158, 11, 0.08); color:rgb(245, 158, 11); font-size:0.8rem; font-weight:600; padding:12px 14px; border-radius:8px; margin-bottom:16px; border:1px solid rgba(245, 158, 11, 0.2); display:flex; align-items:center; gap:8px;">
            <span style="font-size:1.1rem; line-height:1;">⚠️</span>
            <span>Kartu ini sedang diajukan untuk dihapus. Menunggu persetujuan Pengawas Binaan.</span>
          </div>
        `;
      }
    }
    
    // Status Pilling
    const statuses = [
      { id: 'Belum Mulai', label: 'Belum', pillClass: 'todo' },
      { id: 'Sedang Berjalan', label: 'Sedang', pillClass: 'proses' },
      { id: 'Selesai', label: 'Selesai', pillClass: 'selesai' },
      { id: 'Dibatalkan', label: 'Ditunda', pillClass: 'dibatalkan' }
    ];

    const isNewCard = !card.card_id;
    const allowedStatuses = isNewCard 
      ? statuses.filter(st => st.id === 'Belum Mulai') 
      : statuses;

    const statusPillsHtml = allowedStatuses.map(st => {
      const active = card.status === st.id ? 'active' : '';
      if (editable) {
        return `<button class="status-pill-btn ${st.pillClass} ${active}" onclick="KanbanManager.setModalStatus('${st.id}')">${st.label}</button>`;
      } else {
        return card.status === st.id ? `<button class="status-pill-btn ${st.pillClass} active" disabled>${st.label}</button>` : '';
      }
    }).join('');

    // Parse selected tags
    const selectedTags = card.tag ? card.tag.split(',').map(s => s.trim()).filter(Boolean) : [];
    
    // Group tags by category
    const groupedTags = {};
    const tagIconMap = {};
    (KanbanManager.state.tags || []).forEach(t => {
      const parts = t.split('|');
      const category = parts[0] || 'Lainnya';
      const subcategory = parts[1] || t;
      const icon = parts[2] || '';
      const key = `${category}|${subcategory}`;
      if (!groupedTags[category]) {
        groupedTags[category] = [];
      }
      groupedTags[category].push({ key: key, sub: subcategory, icon: icon });
      if (category && subcategory) {
        tagIconMap[key.toLowerCase()] = icon;
      }
    });

    // Generate edit tag selection (grouped checkboxes)
    const tagsSelectionHtml = Object.keys(groupedTags).map(cat => {
      const optionsHtml = groupedTags[cat].map(item => {
        const isChecked = selectedTags.includes(item.key) ? 'checked' : '';
        return `
          <label style="display:flex; align-items:center; gap:8px; font-size:0.78rem; cursor:pointer; padding:6px 8px; border-radius:4px; transition:background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.04)'" onmouseout="this.style.background='transparent'">
            <input type="checkbox" class="modal-card-tag-checkbox" value="${item.key}" ${isChecked} onchange="KanbanManager.onTagSelectionChange()" style="cursor:pointer; width:14px; height:14px; margin:0;">
            <span style="color:var(--color-text);">${item.icon ? item.icon + ' ' : ''}${item.sub}</span>
          </label>
        `;
      }).join('');
      
      return `
        <div style="border-bottom: 1px dashed var(--color-border-light); padding-bottom: 6px; margin-bottom: 6px;">
          <div style="font-size:0.65rem; font-weight:700; color:var(--color-primary); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; padding-left:4px;">
            📁 ${cat}
          </div>
          <div style="display:flex; flex-direction:column; gap:2px;">
            ${optionsHtml}
          </div>
        </div>
      `;
    }).join('');

    // Pre-render the selected chips inside trigger
    const selectedBadgesHtml = selectedTags.map(t => {
      const parts = t.split('|');
      const cat = parts[0] || '';
      const sub = parts[1] || t;
      const key = `${cat}|${sub}`.toLowerCase();
      const icon = tagIconMap[key] || '🏷️';
      const display = `${cat}: ${sub}`;
      return `
        <span class="multiselect-badge" style="background:rgba(13, 110, 253, 0.08); color:#0d6efd; border:1px solid rgba(13, 110, 253, 0.15); padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:700; display:inline-flex; align-items:center; gap:4px; user-select:none;" onclick="event.stopPropagation(); KanbanManager.deselectTag('${t}')">
          ${icon} ${display} <span style="cursor:pointer; font-weight:bold; font-size:0.8rem; margin-left:2px; color:rgba(13, 110, 253, 0.6);" onmouseover="this.style.color='#0d6efd'" onmouseout="this.style.color='rgba(13, 110, 253, 0.6)'">&times;</span>
        </span>
      `;
    }).join('');

    // Generate read-only tag pills
    const tagPillsHtml = selectedTags.map(t => {
      const parts = t.split('|');
      const cat = parts[0] || '';
      const sub = parts[1] || t;
      const key = `${cat}|${sub}`.toLowerCase();

      const display = `${cat} | ${sub}`;
      return `
        <span style="background:rgba(13, 110, 253, 0.08); color:#0d6efd; border:1px solid rgba(13, 110, 253, 0.15); padding:4px 10px; border-radius:20px; font-size:0.72rem; font-weight:700; display:inline-flex; align-items:center; gap:4px; margin: 2px 0;">

    // Render list of detailed notes (work_notes)
    const workNotes = card.work_notes || [];
    workNotes.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

                <button onclick="KanbanManager.removeDetailedNote(${idx})" style="border:none; background:transparent; color:var(--color-danger); cursor:pointer; font-size:0.8rem;" title="Hapus Catatan">🗑️</button>

            ${note.card_status ? `
              <div style="font-size:0.65rem; color:#666; display:flex; align-items:center; gap:4px; margin-top:-2px; margin-bottom:4px; padding-left:22px;">

                  <span class="kanban-indicator ${KanbanView.getStageColorClass(note.card_status)}" style="width:6px; height:6px; display:inline-block; flex-shrink:0;"></span>

                </span>
              </div>
            ` : ''}
            <div style="font-size:0.8rem; line-height:1.4; color:var(--color-text); white-space:pre-wrap; padding-left:22px;">${note.text}</div>
            <span style="font-size:0.62rem; color:#888; text-align:right;">${Utils.formatTimeAgo(note.created_at)}</span>
          </div>
        `;
      }).join('');
    } else {
      workNotesHtml = `<div style="text-align:center; padding:14px; font-size:0.75rem; color:var(--color-text-light); border:1px dashed var(--color-border); border-radius:var(--radius-sm);">Belum ada catatan detail per tahapan</div>`;
    }

    // Filter attachments by category
    const allAttachments = card.attachments || [];
    const files = allAttachments.filter(att => att.type !== 'link');
    const links = allAttachments.filter(att => att.type === 'link');

    // Render files HTML
    let filesHtml = '';
    if (files.length > 0) {
      filesHtml = files.map(att => {
        const index = allAttachments.indexOf(att);

        if (att.type === 'image') icon = '🖼️';
        if (att.type === 'pdf') icon = '📄';
        const openAction = `href="${att.url}" target="_blank" onclick="event.preventDefault(); KanbanManager.previewAttachmentByIndex('${card.card_id}', ${index})"`;

          <div class="attachment-item-edit" style="display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:8px 0; border-bottom:1px solid var(--color-border-light, #eee);">

              <div style="display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">

                <a ${openAction} style="color:var(--color-primary); text-decoration:none; font-size:0.8rem; font-weight:600; cursor:pointer;">${att.name}</a>
              </div>
              ${editable ? `
                <button onclick="KanbanManager.removeAttachment(${index})" style="border:none; background:transparent; color:var(--color-danger); cursor:pointer; font-size:0.8rem;" title="Hapus">🗑️</button>
              ` : ''}
            </div>

                  <span class="kanban-indicator ${KanbanView.getStageColorClass(att.card_status)}" style="width:6px; height:6px; display:inline-block; flex-shrink:0;"></span>
                  ${att.card_status}
                </span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    } else {
      filesHtml = `<div style="text-align:center;padding:12px;font-size:0.75rem;color:var(--color-text-light);border:1px dashed var(--color-border);border-radius:var(--radius-sm);">Belum ada berkas lampiran</div>`;

    // Render links HTML
    let linksHtmlList = '';
    if (links.length > 0) {

              <div style="display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">

                <a ${openAction} style="color:var(--color-primary); text-decoration:none; font-size:0.8rem; font-weight:600; cursor:pointer;">${att.name}</a>

              </div>

    cardComments.sort((a,b) => new Date(a.created_at) - new Date(b.created_at)); // Oldest first

    // Filter out system comments by default for the initial log html
    const visibleInitialComments = cardComments.filter(comm => comm.author_role !== 'System');

    const commentsLogHtml = visibleInitialComments.map(comm => {

          <div style="word-break:break-word;">${comm.comment_text}</div>

            ` : `
              <h3 style="margin:0;font-size:1.2rem;font-weight:700;color:var(--color-text);">${card.title || ''}</h3>
            `}
          </div>

          <div>
            <label class="kanban-modal-label">Perkiraan Penyelesaian</label>

            ` : `
              <div style="font-size:0.82rem; color:var(--color-text); font-weight:600; padding:10px 12px; border:1px solid var(--color-border-light); border-radius:var(--radius-md); background:rgba(0,0,0,0.01);">
                ${card.tgl_selesai ? (() => {
                  const parts = card.tgl_selesai.split('-');
                  if (parts.length === 3) {
                    const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                    const day = parseInt(parts[2], 10);
                    const month = months[parseInt(parts[1], 10) - 1] || '';
                    const year = parts[0];
                    return `${day} ${month} ${year}`;
                  }
                  return card.tgl_selesai;
                })() : 'Belum diatur'}

                ${tagPillsHtml || '<span style="font-size:0.8rem;color:var(--color-text-light);">Tidak ada tagging.</span>'}

            <div class="comment-input-area">
              <input type="text" id="comment-message" class="comment-text-input" placeholder="Tulis masukan atau pertanyaan..." onkeypress="if(event.key === 'Enter') KanbanManager.submitComment()">
              <button class="btn" onclick="KanbanManager.submitComment()" style="border-radius:50%;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--color-primary);color:white;border:none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 2px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          </div>
          <div style="font-size:0.65rem;color:var(--color-text-light);line-height:1.3;margin-bottom:10px;">
            💡 Diskusi ini dapat dibaca oleh Kepala Madrasah dan Pengawas Binaan terkait untuk konsultasi langsung.
          </div>
          
          <div style="display:flex;justify-content:flex-end;border-top:1px solid var(--color-border-light);padding-top:16px;">
            <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; margin: 0;" onclick="KanbanManager.closeModal()">Tutup</button>
          </div>
        </div>
      </div>

      <!-- Tab Content 3: Approval (Pengesahan) -->
      ${card.card_id ? `
      <div id="tab-content-approval" class="kanban-tab-content" style="display: none;">
        <div style="display:flex; flex-direction:column; gap:16px;">
          
          ${isSupervisor ? `
            <!-- Supervisor View -->
            ${isDeleteRequested ? `
              <div style="background:rgba(239, 68, 68, 0.08); color:rgb(239, 68, 68); font-size:0.82rem; font-weight:600; padding:16px; border-radius:8px; border:1px solid rgba(239, 68, 68, 0.2); display:flex; flex-direction:column; gap:12px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-size:1.3rem; line-height:1;">⚠️</span>
                  <span style="font-size:0.9rem; font-weight:700;">Pengajuan Hapus Kartu</span>
                </div>
                <div>Kepala Madrasah mengajukan permohonan untuk menghapus tugas ini. Silakan berikan keputusan Anda.</div>
                <div style="display:flex; gap:8px; margin-top:4px;">
                  <button class="btn" style="width: auto; padding: 8px 16px; margin: 0; background: var(--color-primary); color: white;" onclick="KanbanManager.approveDelete('${card.card_id}')">✅ Setujui Hapus</button>
                  <button class="btn" style="width: auto; padding: 8px 16px; margin: 0; background: var(--color-accent); color: white;" onclick="KanbanManager.rejectDelete('${card.card_id}')">❌ Tolak Hapus</button>
                </div>
              </div>
            ` : ''}

            ${card.status === 'Selesai' ? `
              <div style="background:${isApproved ? 'rgba(16, 185, 129, 0.08)' : 'rgba(245, 158, 11, 0.08)'}; color:${isApproved ? 'rgb(16, 185, 129)' : 'rgb(245, 158, 11)'}; font-size:0.82rem; font-weight:600; padding:16px; border-radius:8px; border:1px solid ${isApproved ? 'rgba(16, 185, 129, 0.2)' : 'rgba(245, 158, 11, 0.2)'}; display:flex; flex-direction:column; gap:12px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-size:1.3rem; line-height:1;">${isApproved ? '✅' : '⏳'}</span>
                  <span style="font-size:0.9rem; font-weight:700;">${isApproved ? 'Tugas Telah Disahkan' : 'Persetujuan Selesai'}</span>
                </div>
                <div>${isApproved ? 'Penyelesaian tugas ini telah Anda setujui dan disahkan.' : 'Tugas ini telah diselesaikan oleh Kepala Madrasah. Silakan periksa pekerjaan dan berikan pengesahan.'}</div>
                <div style="display:flex; gap:8px; margin-top:4px;">
                  ${!isApproved ? `
                    <button class="btn" style="width: auto; padding: 8px 16px; margin: 0; background: var(--color-success); color: white;" onclick="KanbanManager.executeApproveCompletion('${card.card_id}')">✔️ Setujui Selesai</button>
                  ` : `
                    <button class="btn" style="width: auto; padding: 8px 16px; margin: 0; background: var(--color-accent); color: white;" onclick="KanbanManager.executeCancelCompletion('${card.card_id}')">⚠️ Batalkan Setuju</button>
                  `}
                </div>
              </div>
            ` : ''}

            ${(!isDeleteRequested && card.status !== 'Selesai') ? `
              <div style="text-align:center; padding:40px 20px; color:var(--color-text-secondary); font-size:0.82rem; border:1px dashed var(--color-border); border-radius:var(--radius-md); background:rgba(0,0,0,0.01);">
                🛡️ <strong style="display:block; margin-top:8px; color:var(--color-text);">Tidak Ada Pengajuan Aktif</strong>
                Tugas ini masih berstatus <strong>"${card.status}"</strong>.<br>Pengesahan hanya tersedia untuk tugas yang berstatus <strong>"Selesai"</strong> atau sedang diajukan untuk <strong>"Dihapus"</strong>.
              </div>
            ` : ''}
          ` : `
            <!-- Kamad View -->
            ${isDeleteRequested ? `
              <div style="background:rgba(245, 158, 11, 0.08); color:rgb(245, 158, 11); font-size:0.82rem; font-weight:600; padding:16px; border-radius:8px; border:1px solid rgba(245, 158, 11, 0.2); display:flex; flex-direction:column; gap:12px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-size:1.3rem; line-height:1;">⏳</span>
                  <span style="font-size:0.9rem; font-weight:700;">Menunggu Persetujuan Penghapusan</span>
                </div>
                <div>Kartu ini sedang diajukan untuk dihapus. Menunggu persetujuan dari Pengawas Binaan.</div>
                <div style="display:flex; gap:8px; margin-top:4px;">
                  <button class="btn" style="width: auto; padding: 8px 16px; margin: 0; background: var(--color-accent); color: white;" onclick="KanbanManager.cancelDeleteRequest('${card.card_id}')">🔄 Batalkan Pengajuan Hapus</button>
                </div>
              </div>
            ` : ''}

            ${card.status === 'Selesai' ? `
              <div style="background:${isApproved ? 'rgba(16, 185, 129, 0.08)' : 'rgba(245, 158, 11, 0.08)'}; color:${isApproved ? 'rgb(16, 185, 129)' : 'rgb(245, 158, 11)'}; font-size:0.82rem; font-weight:600; padding:16px; border-radius:8px; border:1px solid ${isApproved ? 'rgba(16, 185, 129, 0.2)' : 'rgba(245, 158, 11, 0.2)'}; display:flex; flex-direction:column; gap:8px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-size:1.3rem; line-height:1;">${isApproved ? '✅' : '⏳'}</span>
                  <span style="font-size:0.9rem; font-weight:700;">${isApproved ? 'Tugas Telah Disahkan' : 'Menunggu Pengesahan'}</span>
                </div>
                <div>${isApproved ? 'Penyelesaian tugas ini telah disetujui dan disahkan oleh Pengawas Binaan.' : 'Tugas telah diselesaikan dan sedang menunggu pengesahan dari Pengawas Binaan.'}</div>
              </div>
            ` : ''}

            ${(!isDeleteRequested && card.status !== 'Selesai') ? `
              <div style="text-align:center; padding:40px 20px; color:var(--color-text-secondary); font-size:0.82rem; border:1px dashed var(--color-border); border-radius:var(--radius-md); background:rgba(0,0,0,0.01);">
                🛡️ <strong style="display:block; margin-top:8px; color:var(--color-text);">Status Pengesahan</strong>
                Tugas ini berstatus <strong>"${card.status}"</strong>.<br>Pengesahan akan diperlukan jika tugas dipindahkan ke status <strong>"Selesai"</strong> atau jika Anda mengajukan penghapusan kartu.
              </div>
            ` : ''}
          `}
          
          <div style="display:flex; justify-content:flex-end; border-top:1px solid var(--color-border-light); padding-top:16px; margin-top:10px;">
            <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; margin: 0;" onclick="KanbanManager.closeModal()">Tutup</button>
          </div>
        </div>
      </div>
      ` : ''}
    `;
  }
};

const KanbanManager = {
  state: {
    cards: [],
    comments: [],
    tags: [],
    currentCard: null, // Holds copy of card being edited
    accordions: {
      notes: false,
      attachments: false
    }
  },

  /**
   * Initialize Kanban View
   */
  init() {
    const el = document.getElementById('app');
    el.innerHTML = KanbanView.skeleton();

    this.refreshBoard();
  },

  /**
   * Pull latest cards and comments from Google Sheet
   */
  refreshBoard() {
    const nsm = App.state.kamad?.nsm;
    if (!nsm) { App.router('kamad-login'); return; }

    App.loading(true, 'Mengambil data Kanban...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          this.state.cards = res.data.cards || [];
          this.state.comments = res.data.comments || [];
          this.state.tags = res.data.tags || [];
          // Update the dashboard cached data also
          App.state.kanbanData = res.data;
          
          this.render();
        } else {
          App.alert('Gagal memuat papan Kanban: ' + res.error, 'Error');
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        App.alert('Koneksi terputus: ' + (err.message || err), 'Error');
      })
      .kanbanGetBoardData(nsm);
  },

  /**
   * Render board UI
   */
  render() {
    const nsm = App.state.kamad?.nsm;
    const name = App.state.kamad?.madrasah_name || 'Madrasah';
    const el = document.getElementById('app');
    
    el.innerHTML = KanbanView.main(name, this.state.cards, this.state.comments);
  },

  /**
   * Open New Card Dialog (Kamad only)
   */
  openNewCardModal() {
    this.state.currentCard = {
      card_id: '',
      title: '',
      description: '',
      status: 'Belum Mulai',
      attachments: [],
      tag: '',
      work_details: '',
      tgl_selesai: ''
    };

    const modal = document.getElementById('kanban-modal');
    const content = document.getElementById('kanban-modal-content');
    
    content.innerHTML = KanbanView.modalContent(this.state.currentCard, []);
    modal.style.display = 'flex';
    this.switchModalTab('details'); // Default tab untuk kartu baru adalah detail
  },

  /**
   * Switch Modal Tab
   */
  switchModalTab(tab) {
    this.state.activeModalTab = tab;
    
    const btnDetails = document.getElementById('tab-btn-details');
    const btnDiscussion = document.getElementById('tab-btn-discussion');
    const btnApproval = document.getElementById('tab-btn-approval');
    
    const contentDetails = document.getElementById('tab-content-details');
    const contentDiscussion = document.getElementById('tab-content-discussion');
    const contentApproval = document.getElementById('tab-content-approval');
    
    const setActive = (btn, content, displayStyle = 'block') => {
      if (btn) {
        btn.style.color = 'var(--color-primary)';
        btn.style.borderBottomColor = 'var(--color-primary)';
        btn.style.fontWeight = '700';
      }
      if (content) {
        content.style.display = displayStyle;
      }
    };
    
    const setInactive = (btn, content) => {
      if (btn) {
        btn.style.color = 'var(--color-text-secondary)';
        btn.style.borderBottomColor = 'transparent';
        btn.style.fontWeight = '600';
      }
      if (content) {
        content.style.display = 'none';
      }
    };
    
    setInactive(btnDetails, contentDetails);
    setInactive(btnDiscussion, contentDiscussion);
    setInactive(btnApproval, contentApproval);
    
    if (tab === 'details') {
      setActive(btnDetails, contentDetails, 'block');
    } else if (tab === 'discussion') {
      setActive(btnDiscussion, contentDiscussion, 'flex');
      this.scrollCommentsToBottom();
    } else if (tab === 'approval') {
      setActive(btnApproval, contentApproval, 'block');
    }
  },

  /**
   * Open Card Details and Load Comments
   */
  openCardModal(cardId) {
    const card = this.state.cards.find(c => c.card_id === cardId);
    if (!card) return;

    // Clone card so we can manipulate attachments locally before saving
    this.state.currentCard = JSON.parse(JSON.stringify(card));

    // MARK AS SEEN: Save current timestamp to localStorage for unread comments tracking
    localStorage.setItem(`kanban_card_last_seen_${cardId}`, new Date().toISOString());

    const modal = document.getElementById('kanban-modal');
    const content = document.getElementById('kanban-modal-content');
    
    content.innerHTML = KanbanView.modalContent(this.state.currentCard, this.state.comments);
    modal.style.display = 'flex';
    this.switchModalTab('discussion'); // Default tab untuk kartu lama adalah diskusi
    
    // Auto scroll comment panel to bottom
    this.scrollCommentsToBottom();
  },

  refreshCardDetail() {
    if (!this.state.currentCard || !this.state.currentCard.card_id) return;
    
    const cardId = this.state.currentCard.card_id;
    const nsm = App.state.kamad?.nsm;
    if (!nsm) return;

    const refreshBtn = document.getElementById('modal-refresh-btn');
    if (refreshBtn) {
      refreshBtn.style.animation = 'spin 0.8s linear infinite';
    }

    google.script.run
      .withSuccessHandler(res => {
        if (refreshBtn) {
          refreshBtn.style.animation = 'none';
        }
        if (res.success) {
          this.state.cards = res.data.cards || [];
          this.state.comments = res.data.comments || [];
          this.state.tags = res.data.tags || [];
          App.state.kanbanData = res.data;

          const card = this.state.cards.find(c => c.card_id === cardId);
          if (card) {
            this.state.currentCard = JSON.parse(JSON.stringify(card));
            const content = document.getElementById('kanban-modal-content');
            if (content) {
              content.innerHTML = KanbanView.modalContent(this.state.currentCard, this.state.comments);
              const activeTab = this.state.activeModalTab || 'discussion';
              this.switchModalTab(activeTab);
            }
          } else {
            App.alert('Kartu ini telah dihapus oleh pengguna lain.', 'Info');
            this.closeModal();
          }
        } else {
          App.alert('Gagal menyegarkan: ' + res.error, 'Gagal');
        }
      })
      .withFailureHandler(err => {
        if (refreshBtn) {
          refreshBtn.style.animation = 'none';
        }
        App.alert('Koneksi terputus: ' + (err.message || err), 'Error');
      })
      .kanbanGetBoardData(nsm);
  },

  /**
   * Close Card Modal and refresh current board
   */
  closeModal() {
    document.getElementById('kanban-modal').style.display = 'none';
    this.state.currentCard = null;
    
    // Refresh UI to update unread badge counts
    this.render();
  },

  toggleAccordion(type, modalType = 'main') {
    if (modalType === 'quickAdd') {
      if (!this.state.quickAddAccordions) {
        this.state.quickAddAccordions = { notes: true, attachments: true, links: true };
      }
      this.state.quickAddAccordions[type] = !this.state.quickAddAccordions[type];
      const el = document.getElementById(`qa-accordion-${type}`);
      const content = document.getElementById(`qa-accordion-${type}-content`);
      if (el && content) {
        if (this.state.quickAddAccordions[type]) {
          el.classList.add('open');
          content.style.display = 'block';
        } else {
          el.classList.remove('open');
          content.style.display = 'none';
        }
      }
    } else {
      if (!this.state.accordions) {
        this.state.accordions = { notes: false, attachments: false, links: false };
      }
      this.state.accordions[type] = !this.state.accordions[type];
      const el = document.getElementById(`accordion-${type}`);
      const content = document.getElementById(`accordion-${type}-content`);
      if (el && content) {
        if (this.state.accordions[type]) {
          el.classList.add('open');
          content.style.display = 'block';
        } else {
          el.classList.remove('open');
          content.style.display = 'none';
        }
      }
    }
  },

  toggleTagDropdown(e) {
    e.stopPropagation();
    const dropdown = document.getElementById('tag-multiselect-dropdown');
    const trigger = e.currentTarget;
    if (dropdown) {
      const isVisible = dropdown.style.display === 'block';
      dropdown.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) {
        trigger.classList.add('active');
      } else {
        trigger.classList.remove('active');
      }
    }
  },

  onTagSelectionChange() {
    const checkboxes = document.querySelectorAll('.modal-card-tag-checkbox');
    const selectedTags = [];
    checkboxes.forEach(cb => {
      if (cb.checked) {
        selectedTags.push(cb.value);
      }
    });

    if (this.state.currentCard) {
      this.state.currentCard.tag = selectedTags.join(',');
    }

    const badgeContainer = document.getElementById('multiselect-selected-badges');
    if (badgeContainer) {
      if (selectedTags.length === 0) {
        badgeContainer.innerHTML = '<span style="color:var(--color-text-light); font-size:0.8rem;">Pilih Kategori / Tagging...</span>';
      } else {
        const tagIconMap = {};
        (this.state.tags || []).forEach(t => {
          const parts = t.split('|');
          const category = parts[0] || '';
          const subcategory = parts[1] || '';
          const icon = parts[2] || '';
          if (category && subcategory) {
            tagIconMap[`${category}|${subcategory}`.toLowerCase()] = icon;
          }
        });

        badgeContainer.innerHTML = selectedTags.map(t => {
          const parts = t.split('|');
          const cat = parts[0] || '';
          const sub = parts[1] || t;
          const key = `${cat}|${sub}`.toLowerCase();
          const icon = tagIconMap[key] || '🏷️';
          const display = `${cat}: ${sub}`;
          return `
            <span class="multiselect-badge" style="background:rgba(13, 110, 253, 0.08); color:#0d6efd; border:1px solid rgba(13, 110, 253, 0.15); padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:700; display:inline-flex; align-items:center; gap:4px; user-select:none;" onclick="event.stopPropagation(); KanbanManager.deselectTag('${t}')">
              ${icon} ${display} <span style="cursor:pointer; font-weight:bold; font-size:0.8rem; margin-left:2px; color:rgba(13, 110, 253, 0.6);" onmouseover="this.style.color='#0d6efd'" onmouseout="this.style.color='rgba(13, 110, 253, 0.6)'">&times;</span>
            </span>
          `;
        }).join('');
      }
    }
  },

  deselectTag(tagValue) {
    const checkboxes = document.querySelectorAll('.modal-card-tag-checkbox');
    checkboxes.forEach(cb => {
      if (cb.value === tagValue) {
        cb.checked = false;
      }
    });
    this.onTagSelectionChange();
  },

  /**
   * Set Status locally in modal
   */
  setModalStatus(status) {
    if (!this.state.currentCard) return;
    
    // Cegah pemindahan kembali ke 'Belum Mulai' jika kartu sudah berjalan
    const originalCard = this.state.cards.find(c => c.card_id === this.state.currentCard.card_id);
    const originalStatus = originalCard ? originalCard.status : 'Belum Mulai';

    if (originalStatus !== 'Belum Mulai' && status === 'Belum Mulai') {
      App.alert('Kartu yang sudah berjalan tidak dapat dikembalikan ke status Belum Mulai.', 'Tindakan Ditolak');
      return;
    }

    this.state.currentCard.status = status;
    
    // Refresh status pill buttons
    const pills = document.querySelectorAll('.status-pill-btn');
    pills.forEach(pill => {
      pill.classList.remove('active');
      const text = pill.textContent.toLowerCase();
      
      const stMap = { 
        'todo': 'Belum Mulai', 
        'belum': 'Belum Mulai',
        'proses': 'Sedang Berjalan', 
        'sedang': 'Sedang Berjalan',
        'selesai': 'Selesai', 
        'dibatalkan': 'Dibatalkan', 
        'dibatalkan/tunda': 'Dibatalkan',
        'ditunda': 'Dibatalkan' 
      };
      if (stMap[text] === status) {
        pill.classList.add('active');
      }
    });
  },

  /**
   * Handle base64 file upload to Google Drive
   */
  handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    const nsm = App.state.kamad?.nsm;
    if (!nsm) return;

    // Restrict size to 10MB
    if (file.size > 10 * 1024 * 1024) {
      App.alert('Ukuran berkas tidak boleh melebihi 10MB.', 'Peringatan');
      e.target.value = '';
      return;
    }

    App.loading(true, 'Mengunggah berkas ke Drive...');
    
    const reader = new FileReader();
    reader.onload = (evt) => {
      const base64Data = evt.target.result;
      
      google.script.run
        .withSuccessHandler(res => {
          App.loading(false);
          e.target.value = ''; // Reset input
          
          if (res.success) {
            const attType = file.type.startsWith('image/') ? 'image' : 'pdf';
            this.state.currentCard.attachments.push({
              type: attType,
              name: file.name,
              url: res.data.url,
              card_status: this.state.currentCard.status || 'Belum Mulai'
            });
            
            // Re-render attachments list area
            this.updateAttachmentsView();
            this.systemComment(`Mengunggah berkas: ${file.name}`);
          } else {
            App.alert('Gagal mengunggah berkas: ' + res.error, 'Gagal');
          }
        })
        .withFailureHandler(err => {
          App.loading(false);
          e.target.value = '';
          App.alert('Terjadi kesalahan koneksi: ' + (err.message || err), 'Error');
        })
        .kanbanUploadAttachment(nsm, base64Data, file.name);
    };
    reader.readAsDataURL(file);
  },

  /**
   * Add typed Link to attachments list
   */
  addLinkAttachment() {
    if (!this.state.currentCard) return;

    const nameEl = document.getElementById('kanban-link-name');
    const urlEl = document.getElementById('kanban-link-url');
    
    const name = nameEl.value.trim();
    let url = urlEl.value.trim();

    if (!name || !url) {
      App.alert('Nama link dan URL harus diisi.', 'Validation');
      return;
    }

    // Basic URL validation prepend protocol
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    this.state.currentCard.attachments.push({
      type: 'link',
      name: name,
      url: url,
      card_status: this.state.currentCard.status || 'Belum Mulai'
    });

    nameEl.value = '';
    urlEl.value = '';
    
    this.updateAttachmentsView();
    this.systemComment(`Menambahkan tautan: ${name}`);
  },

  /**
   * Remove attachment from current list
   */
  removeAttachment(index) {
    if (!this.state.currentCard) return;
    const att = this.state.currentCard.attachments[index];
    const attName = att ? (att.name || att.url || 'lampiran') : 'lampiran';
    this.state.currentCard.attachments.splice(index, 1);
    this.updateAttachmentsView();
    this.systemComment(`Menghapus lampiran: ${attName}`);
  },

  /**
   * Re-render attachments container in Modal
   */
  updateAttachmentsView() {
    const list = document.getElementById('modal-attachments-list');
    const linksList = document.getElementById('modal-links-list');
    if (!list) return;

    const editable = !App.state.isSupervisorViewAs;
    if (!this.state.currentCard.attachments) {
      this.state.currentCard.attachments = [];
    }

    const allAttachments = this.state.currentCard.attachments;
    const files = allAttachments.filter(att => att.type !== 'link');
    const links = allAttachments.filter(att => att.type === 'link');

    // Update count spans
    const attachmentsCountSpan = document.getElementById('accordion-attachments-count');
    if (attachmentsCountSpan) {
      attachmentsCountSpan.textContent = files.length;
    }

  /**
   * Save Card details to Google Sheet
   */
  saveCard() {
    if (!this.state.currentCard) return;

    const titleEl = document.getElementById('modal-card-title');
    const title = titleEl ? titleEl.value.trim() : this.state.currentCard.title;
    const descEl = document.getElementById('modal-card-desc');
    const description = descEl ? descEl.value.trim() : this.state.currentCard.description;
    const dueDateEl = document.getElementById('modal-card-due-date');
    const tgl_selesai = dueDateEl ? dueDateEl.value.trim() : (this.state.currentCard.tgl_selesai || '');
    const work_details = this.state.currentCard.work_details || '';

    if (!title) {
      App.alert('Judul kartu tidak boleh kosong.', 'Peringatan');
      return;
    }

    this.state.currentCard.title = title;
    this.state.currentCard.description = description;
    this.state.currentCard.work_details = work_details;
    this.state.currentCard.tgl_selesai = tgl_selesai;

    const checkboxes = document.querySelectorAll('.modal-card-tag-checkbox');
    const checkedTags = [];
    checkboxes.forEach(cb => {
      if (cb.checked) {
        checkedTags.push(cb.value);
      }
    });
    this.state.currentCard.tag = checkboxes.length > 0 ? checkedTags.join(',') : (this.state.currentCard.tag || '');

    const nsm = App.state.kamad?.nsm;
    if (!nsm) return;

    // Konfirmasi pemindahan keluar dari 'Belum Mulai'
    const originalCard = this.state.cards.find(c => c.card_id === this.state.currentCard.card_id);
    const originalStatus = originalCard ? originalCard.status : 'Belum Mulai';
    const newStatus = this.state.currentCard.status;

    if (originalStatus === 'Belum Mulai' && newStatus !== 'Belum Mulai') {
      App.confirm(
        'Apakah Anda yakin ingin memindahkan tugas ini dari Belum Mulai? Kartu yang sudah dipindahkan tidak dapat dihapus langsung atau dikembalikan ke Belum Mulai.',
        'Konfirmasi Pemindahan',
        () => {
          this.executeSaveCard(nsm);
        }
      );
    } else {
      this.executeSaveCard(nsm);
    }
  },

  executeSaveCard(nsm) {
    App.loading(true, 'Menyimpan kartu...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          this.closeModal();
          this.refreshBoard();
        } else {
          App.alert('Gagal menyimpan: ' + res.error, 'Gagal');
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        App.alert('Koneksi terputus: ' + (err.message || err), 'Error');
      })
      .kanbanSaveCard(nsm, this.state.currentCard);
  },
