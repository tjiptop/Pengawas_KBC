  /**
   * Submit comment to Card
   */
  submitComment() {
    if (!this.state.currentCard) return;

    const input = document.getElementById('comment-message');
    const text = input.value.trim();
    if (!text) return;

    const nsm = App.state.kamad?.nsm;
    const isSupervisor = !!App.state.isSupervisorViewAs;
    const authorName = isSupervisor ? App.state.user?.Nama : App.state.kamad?.madrasah_name;
    const authorRole = isSupervisor ? 'Pengawas' : 'Kamad';

    input.value = ''; // Reset input field

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          // Add comment to local list immediately
          this.state.comments.push(res.data);
          
          // Re-render only the comments container inside the modal
          this.updateCommentsLogView();
        } else {
          App.alert('Gagal mengirim komentar: ' + res.error, 'Gagal');
        }
      })
      .withFailureHandler(err => {
        App.alert('Koneksi terputus: ' + (err.message || err), 'Error');
      })
      .kanbanAddComment(nsm, this.state.currentCard.card_id, text, authorName, authorRole);
  },

  /**
   * Re-render comment area inside Modal
   */
  updateCommentsLogView() {
    const log = document.getElementById('modal-comments-log');
    if (!log || !this.state.currentCard) return;

    let cardComments = this.state.comments.filter(comm => comm.card_id === this.state.currentCard.card_id);
    cardComments.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

    const includeSystemCheck = document.getElementById('filter-include-system');
    const includeSystem = includeSystemCheck ? includeSystemCheck.checked : false;

    if (!includeSystem) {
      cardComments = cardComments.filter(comm => comm.author_role !== 'System');
    }

    if (cardComments.length === 0) {
      log.innerHTML = `
        <div style="text-align:center;padding:40px 10px;color:var(--color-text-light);font-size:0.75rem;margin:auto;">
          💬 Belum ada diskusi.<br>Tulis komentar pertama Anda di bawah ini!
        </div>`;
      return;
    }

    log.innerHTML = cardComments.map(comm => {
      let bubbleClass = 'pengawas';
      let roleBadge = 'role-pengawas';
      
      if (comm.author_role === 'System') {
        bubbleClass = 'sistem';
        roleBadge = 'role-sistem';
      } else if (comm.author_role === 'Kamad') {
        bubbleClass = 'kamad';
        roleBadge = 'role-kamad';
      }

      return `
        <div class="comment-item ${bubbleClass}">
          <div class="comment-meta">
            <span class="author-role-badge ${roleBadge}">${comm.author_role}</span>
            ${comm.author_name ? `<span>${comm.author_name}</span>` : ''}
            ${comm.card_status ? `<span style="background:rgba(0,0,0,0.05); color:#666; font-size:0.65rem; padding:1px 6px; border-radius:10px; font-weight:600; margin-left:6px; display:inline-flex; align-items:center; gap:4px;"><span class="kanban-indicator ${KanbanView.getStageColorClass(comm.card_status)}" style="width:6px; height:6px; display:inline-block; flex-shrink:0;"></span>${comm.card_status}</span>` : ''}
          </div>
          <div style="word-break:break-word;">${comm.comment_text}</div>
          <span class="comment-time">${Utils.formatTimeAgo(comm.created_at)}</span>
        </div>
      `;
    }).join('');

    this.scrollCommentsToBottom();
  },

  scrollCommentsToBottom() {
    const log = document.getElementById('modal-comments-log');
    if (log) {
      setTimeout(() => { log.scrollTop = log.scrollHeight; }, 30);
    }
  },

  // ============================================================
  // HTML5 DRAG AND DROP HANDLERS
  // ============================================================

  onDragStart(e) {
    e.dataTransfer.setData('text/plain', e.target.id);
    e.target.classList.add('dragging');
  },

  onDragOver(e) {
    e.preventDefault();
    const list = e.currentTarget.querySelector('.kanban-card-list');
    if (list) {
      list.classList.add('dragover');
    }
  },

  onDragLeave(e) {
    const list = e.currentTarget.querySelector('.kanban-card-list');
    if (list) {
      list.classList.remove('dragover');
    }
  },

  onDrop(e, targetStatus) {
    e.preventDefault();
    const cardId = e.dataTransfer.getData('text/plain');
    const cardEl = document.getElementById(cardId);
    if (cardEl) {
      cardEl.classList.remove('dragging');
    }

    const list = e.currentTarget.querySelector('.kanban-card-list');
    if (list) {
      list.classList.remove('dragover');
    }

    // Find card and check if status actually changed
    const card = this.state.cards.find(c => c.card_id === cardId);
    if (!card || card.status === targetStatus) return;

    const nsm = App.state.kamad?.nsm;
    if (!nsm) return;

    // Cegah pemindahan kembali ke 'Belum Mulai' jika kartu sudah berjalan
    if (card.status !== 'Belum Mulai' && targetStatus === 'Belum Mulai') {
      App.alert('Kartu yang sudah berjalan tidak dapat dikembalikan ke status Belum Mulai.', 'Tindakan Ditolak');
      return;
    }

    // Konfirmasi pemindahan keluar dari 'Belum Mulai'
    if (card.status === 'Belum Mulai' && targetStatus !== 'Belum Mulai') {
      App.confirm(
        'Apakah Anda yakin ingin memindahkan tugas ini dari Belum Mulai? Kartu yang sudah dipindahkan tidak dapat dihapus langsung atau dikembalikan ke Belum Mulai.',
        'Konfirmasi Pemindahan',
        () => {
          this.executeCardMove(nsm, card, targetStatus);
        }
      );
    } else {
      this.executeCardMove(nsm, card, targetStatus);
    }
  },

  executeCardMove(nsm, card, targetStatus) {
    // Optimistic UI update
    card.status = targetStatus;
    this.render();

    google.script.run
      .withSuccessHandler(res => {
        if (!res.success) {
          App.alert('Gagal memindahkan kartu: ' + res.error, 'Gagal');
          this.refreshBoard();
        }
      })
      .withFailureHandler(err => {
        App.alert('Koneksi terputus: ' + (err.message || err), 'Error');
        this.refreshBoard();
      })
      .kanbanMoveCard(nsm, card.card_id, targetStatus);
  },

  /**
   * Preview attachment by card ID and attachment index (safe, avoids string escaping issues)
   */
  previewAttachmentByIndex(cardId, attIndex) {
    // Look in board cards first, then fall back to currently open modal card
    let card = this.state.cards.find(c => c.card_id === cardId);
    if (!card && this.state.currentCard && this.state.currentCard.card_id === cardId) {
      card = this.state.currentCard;
    }
    if (!card || !card.attachments) return;
    const att = card.attachments[attIndex];
    if (!att) return;
    this.previewAttachment(att.url, att.name, att.type);
  },

  previewAttachment(url, name, type) {
    const previewUrl = this.getPreviewUrl(url);
    let modal = document.getElementById('kanban-preview-modal');
    if (!modal) return;

    const titleEl = document.getElementById('preview-modal-title');
    const bodyEl = document.getElementById('preview-modal-body');
    const openBtn = document.getElementById('preview-modal-open-btn');

    if (titleEl) titleEl.textContent = name;
    if (openBtn) {
      openBtn.style.display = 'inline-flex';
      openBtn.href = url;
    }

    let contentHtml = '';
    if (type === 'image') {
      contentHtml = `<img src="${previewUrl}" style="max-width:100%; max-height:65vh; object-fit:contain; border-radius:4px;" />`;
    } else if (type === 'pdf') {
      contentHtml = `<iframe src="${previewUrl}" style="width:100%; height:65vh; min-height:400px; border:none; border-radius:4px;"></iframe>`;
    } else {
      contentHtml = `
        <div style="text-align:center; padding:30px; width:100%;">
          <span style="font-size:3rem; display:block; margin-bottom:10px;">🔗</span>
          <p style="font-size:0.85rem; color:var(--color-text-secondary, #666); margin-bottom:15px;">Tautan luar tidak dapat ditampilkan langsung: <strong>${name}</strong></p>
          <a href="${url}" target="_blank" class="btn" style="display:inline-block; width:auto; padding:8px 20px; font-size:0.8rem; background:var(--color-primary, #0d6efd); color:#fff; text-decoration:none; border-radius:4px;">Buka Tautan External 🚀</a>
        </div>
      `;
    }

    if (bodyEl) bodyEl.innerHTML = contentHtml;
    modal.style.display = 'flex';
  },

  closePreviewModal() {
    const modal = document.getElementById('kanban-preview-modal');
    if (modal) {
      modal.style.display = 'none';
      const bodyEl = document.getElementById('preview-modal-body');
      if (bodyEl) bodyEl.innerHTML = '';
    }
  },

  getPreviewUrl(url) {
    if (url.includes('drive.google.com') && url.includes('/view')) {
      return url.replace('/view', '/preview');
    }
    return url;
  },

  previewDetailedNoteById(cardId, noteId) {
    const card = this.state.cards.find(c => c.card_id === cardId);
    if (!card || !card.work_notes) return;
    const note = card.work_notes.find(n => n.note_id === noteId);
    if (!note) return;
    this.previewDetailedNote(note.text, note.card_status);
  },

  previewDetailedNote(noteText, stage) {
    let modal = document.getElementById('kanban-preview-modal');
    if (!modal) return;

    const titleEl = document.getElementById('preview-modal-title');
    const bodyEl = document.getElementById('preview-modal-body');
    const openBtn = document.getElementById('preview-modal-open-btn');

    if (titleEl) titleEl.textContent = 'Catatan Detail (Tahap: ' + stage + ')';
    if (openBtn) openBtn.style.display = 'none';

    if (bodyEl) {
      bodyEl.innerHTML = `
        <div style="padding: 20px; font-size: 0.88rem; line-height: 1.5; white-space: pre-wrap; color: var(--color-text, #333); width: 100%; text-align: left;">
          ${noteText}
        </div>
      `;
    }
    modal.style.display = 'flex';
  },

  addDetailedNoteFromModal() {
    if (!this.state.currentCard) return;

    const input = document.getElementById('modal-new-work-note-text');
    const text = input ? input.value.trim() : '';
    if (!text) {
      App.alert('Isi catatan tidak boleh kosong.', 'Peringatan');
      return;
    }

    const newNote = {
      note_id: 'NOTE-' + Date.now(),
      text: text,
      created_at: new Date().toISOString(),
      card_status: this.state.currentCard.status
    };

    if (!this.state.currentCard.work_notes) {
      this.state.currentCard.work_notes = [];
    }
    this.state.currentCard.work_notes.push(newNote);

    if (input) input.value = '';
    this.updateWorkNotesView();
    this.systemComment(`Menambahkan catatan detail: "${text.substring(0, 40)}${text.length > 40 ? '...' : ''}"`);
  },

  removeDetailedNote(index) {
    if (!this.state.currentCard || !this.state.currentCard.work_notes) return;
    const note = this.state.currentCard.work_notes[index];
    const notePreview = note ? note.text.substring(0, 30) : '';
    this.state.currentCard.work_notes.splice(index, 1);
    this.updateWorkNotesView();
    this.systemComment(`Menghapus catatan detail: "${notePreview}${notePreview.length >= 30 ? '...' : ''}"`);
  },

  updateWorkNotesView() {
    const list = document.getElementById('modal-work-notes-list');
    if (!list || !this.state.currentCard) return;

    const workNotes = this.state.currentCard.work_notes || [];
    workNotes.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    const editable = !App.state.isSupervisorViewAs;

    const countSpan = document.getElementById('accordion-notes-count');
    if (countSpan) {
      countSpan.textContent = workNotes.length;
    }

    if (workNotes.length === 0) {
      list.innerHTML = `<div style="text-align:center; padding:14px; font-size:0.75rem; color:var(--color-text-light); border:1px dashed var(--color-border); border-radius:var(--radius-sm);">Belum ada catatan detail per tahapan</div>`;
      return;
    }

    list.innerHTML = workNotes.map((note, idx) => {
      return `
        <div class="note-item-edit">
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <div style="display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">
              <span>📝</span>
              <span style="color:var(--color-primary); font-size:0.8rem; font-weight:600;">Catatan #${idx+1}</span>
            </div>
            ${editable ? `
              <button onclick="KanbanManager.removeDetailedNote(${idx})" style="border:none; background:transparent; color:var(--color-danger); cursor:pointer; font-size:0.8rem;" title="Hapus Catatan">🗑️</button>
            ` : ''}
          </div>
          ${note.card_status ? `
            <div style="font-size:0.65rem; color:#666; display:flex; align-items:center; gap:4px; margin-top:-2px; margin-bottom:4px; padding-left:22px;">
              <span style="background:rgba(0,0,0,0.05); padding:1px 6px; border-radius:8px; font-weight:600; display:inline-flex; align-items:center; gap:4px;">
                <span class="kanban-indicator ${KanbanView.getStageColorClass(note.card_status)}" style="width:6px; height:6px; display:inline-block; flex-shrink:0;"></span>
                ${note.card_status}
              </span>
            </div>
          ` : ''}
          <div style="font-size:0.8rem; line-height:1.4; color:var(--color-text); white-space:pre-wrap; padding-left:22px;">${note.text}</div>
          <span style="font-size:0.62rem; color:#888; text-align:right;">${Utils.formatTimeAgo(note.created_at)}</span>
        </div>
      `;
    }).join('');
  },

  openQuickNotesModal(cardId) {
    const card = this.state.cards.find(c => c.card_id === cardId);
    if (!card) return;

    localStorage.setItem(`kanban_card_last_seen_${cardId}`, new Date().toISOString());

    const modal = document.getElementById('kanban-quick-notes-modal');
    if (!modal) return;

    this.state.quickNotesCardId = cardId;

    const titleEl = document.getElementById('quick-notes-title');
    if (titleEl) titleEl.innerHTML = 'Ruang Diskusi: <span style="font-weight:500;">' + card.title + '</span>';

    this.updateQuickNotesView();
    modal.style.display = 'flex';
    
    const log = document.getElementById('quick-notes-body');
    if (log) {
      setTimeout(() => { log.scrollTop = log.scrollHeight; }, 50);
    }
  },

  closeQuickNotesModal() {
    const modal = document.getElementById('kanban-quick-notes-modal');
    if (modal) {
      modal.style.display = 'none';
    }
    this.state.quickNotesCardId = null;
    this.render();
  },

  updateQuickNotesView() {
    const log = document.getElementById('quick-notes-body');
    if (!log || !this.state.quickNotesCardId) return;

    const cardId = this.state.quickNotesCardId;
    let cardComments = this.state.comments.filter(comm => comm.card_id === cardId);
    cardComments.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

    // Filter out system comments by default for consistency
    cardComments = cardComments.filter(comm => {
      const isSystem = comm.author_role === 'System' || (comm.author_name && comm.author_name.startsWith('Sistem ('));
      return !isSystem;
    });

    if (cardComments.length === 0) {
      log.innerHTML = `
        <div style="text-align:center; padding:40px 10px; color:var(--color-text-light); font-size:0.75rem;">
          💬 Belum ada diskusi.<br>Tulis komentar pertama Anda di bawah ini!
        </div>`;
      return;
    }

    log.innerHTML = cardComments.map(comm => {
      const isKamad = comm.author_role === 'Kamad';
      const bubbleClass = isKamad ? 'kamad' : 'pengawas';
      const roleBadge = isKamad ? 'role-kamad' : 'role-pengawas';

      return `
        <div class="comment-item ${bubbleClass}">
          <div class="comment-meta">
            <span class="author-role-badge ${roleBadge}">${comm.author_role}</span>
            <span>${comm.author_name}</span>
            ${comm.card_status ? `<span style="background:rgba(0,0,0,0.05); color:#666; font-size:0.62rem; padding:1px 5px; border-radius:10px; font-weight:600; margin-left:6px; display:inline-flex; align-items:center; gap:4px;"><span class="kanban-indicator ${KanbanView.getStageColorClass(comm.card_status)}" style="width:6px; height:6px; display:inline-block; flex-shrink:0;"></span>${comm.card_status}</span>` : ''}
          </div>
          <div style="word-break:break-word; font-size:0.8rem; margin-top:4px;">${comm.comment_text}</div>
          <span class="comment-time" style="font-size:0.62rem; margin-top:2px;">${Utils.formatTimeAgo(comm.created_at)}</span>
        </div>
      `;
    }).join('');
  },

  submitQuickNote() {
    const cardId = this.state.quickNotesCardId;
    if (!cardId) return;

    const input = document.getElementById('quick-note-input');
    const text = input.value.trim();
    if (!text) return;

    const nsm = App.state.kamad?.nsm;
    const isSupervisor = !!App.state.isSupervisorViewAs;
    const authorName = isSupervisor ? App.state.user?.Nama : App.state.kamad?.madrasah_name;
    const authorRole = isSupervisor ? 'Pengawas' : 'Kamad';

    input.value = '';

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          this.state.comments.push(res.data);
          this.updateQuickNotesView();
          
          const log = document.getElementById('quick-notes-body');
          if (log) {
            setTimeout(() => { log.scrollTop = log.scrollHeight; }, 30);
          }
        } else {
          App.alert('Gagal mengirim catatan: ' + res.error, 'Gagal');
        }
      })
      .withFailureHandler(err => {
        App.alert('Koneksi terputus: ' + (err.message || err), 'Error');
      })
      .kanbanAddComment(nsm, cardId, text, authorName, authorRole);
  },

  openQuickAddModal(cardId) {
    const card = this.state.cards.find(c => c.card_id === cardId);
    if (!card) return;

    this.state.quickAddCardId = cardId;

    const modal = document.getElementById('kanban-quick-add-modal');
    if (!modal) return;

    const titleEl = document.getElementById('quick-add-card-title');
    const statusEl = document.getElementById('quick-add-card-status');
    const noteTextEl = document.getElementById('quick-add-note-text');
    const fileUploaderEl = document.getElementById('quick-add-file-uploader');
    const linkNameEl = document.getElementById('quick-add-link-name');
    const linkUrlEl = document.getElementById('quick-add-link-url');

    if (titleEl) titleEl.textContent = card.title;
    if (statusEl) statusEl.textContent = card.status;
    if (noteTextEl) noteTextEl.value = '';
    if (fileUploaderEl) fileUploaderEl.value = '';
    if (linkNameEl) linkNameEl.value = '';
    if (linkUrlEl) linkUrlEl.value = '';

    modal.style.display = 'flex';
    this.state.quickAddAccordions = { notes: true, attachments: true };
    const accNotes = document.getElementById('qa-accordion-notes');
    const contentNotes = document.getElementById('qa-accordion-notes-content');
    const accAtts = document.getElementById('qa-accordion-attachments');
    const contentAtts = document.getElementById('qa-accordion-attachments-content');
    if (accNotes) accNotes.classList.add('open');
    if (contentNotes) contentNotes.style.display = 'block';
    if (accAtts) accAtts.classList.add('open');
    if (contentAtts) contentAtts.style.display = 'block';
  },

  closeQuickAddModal() {
    const modal = document.getElementById('kanban-quick-add-modal');
    if (modal) {
      modal.style.display = 'none';
    }
    this.state.quickAddCardId = null;
    this.render();
  },

  submitQuickAddNote() {
    const cardId = this.state.quickAddCardId;
    if (!cardId) return;

    const card = this.state.cards.find(c => c.card_id === cardId);
    if (!card) return;

    const textEl = document.getElementById('quick-add-note-text');
    const text = textEl ? textEl.value.trim() : '';
    if (!text) {
      App.alert('Catatan tidak boleh kosong.', 'Peringatan');
      return;
    }

    const nsm = App.state.kamad?.nsm;
    if (!nsm) return;

    const newNote = {
      note_id: 'NOTE-' + Date.now(),
      text: text,
      created_at: new Date().toISOString(),
      card_status: card.status
    };

    if (!card.work_notes) {
      card.work_notes = [];
    }
    card.work_notes.push(newNote);

    App.loading(true, 'Menyimpan catatan detail...');

    google.script.run
      .withSuccessHandler(saveRes => {
        App.loading(false);
        if (saveRes.success) {
          if (textEl) textEl.value = '';
          App.alert('Catatan detail berhasil ditambahkan!', 'Sukses');
          this.systemComment('Menambahkan catatan detail per tahapan.', cardId);
          this.closeQuickAddModal();
        } else {
          App.alert('Gagal menyimpan catatan detail: ' + saveRes.error, 'Gagal');
          card.work_notes.pop();
        }
      })
      .withFailureHandler(saveErr => {
        App.loading(false);
        App.alert('Koneksi terputus saat menyimpan catatan detail: ' + (saveErr.message || saveErr), 'Error');
        card.work_notes.pop();
      })
      .kanbanSaveCard(nsm, card);
  },

  handleQuickAddFileUpload(e) {
    const cardId = this.state.quickAddCardId;
    if (!cardId) return;

    const card = this.state.cards.find(c => c.card_id === cardId);
    if (!card) return;

    const file = e.target.files[0];
    if (!file) return;

    const nsm = App.state.kamad?.nsm;
    if (!nsm) return;

    if (file.size > 10 * 1024 * 1024) {
      App.alert('Ukuran berkas tidak boleh melebihi 10MB.', 'Peringatan');
      e.target.value = '';
      return;
    }

    App.loading(true, 'Mengunggah berkas ke Drive...');
    
    const reader = new FileReader();
    reader.onload = (evt) => {
      const base64Data = evt.target.result;
      
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            const attType = file.type.startsWith('image/') ? 'image' : 'pdf';
            const newAttachment = {
              type: attType,
              name: file.name,
              url: res.data.url,
              card_status: card.status
            };

            card.attachments.push(newAttachment);

            google.script.run
              .withSuccessHandler(saveRes => {
                App.loading(false);
                if (saveRes.success) {
                  App.alert('Berkas berhasil diunggah dan disimpan ke kartu!', 'Sukses');
                  this.systemComment(`Menambahkan berkas lampiran: ${file.name}`, cardId);
                  this.closeQuickAddModal();
                } else {
                  App.alert('Gagal memperbarui data kartu: ' + saveRes.error, 'Gagal');
                  card.attachments.pop();
                }
              })
              .withFailureHandler(saveErr => {
                App.loading(false);
                App.alert('Koneksi terputus saat menyimpan kartu: ' + (saveErr.message || saveErr), 'Error');
                card.attachments.pop();
              })
              .kanbanSaveCard(nsm, card);
          } else {
            App.loading(false);
            App.alert('Gagal mengunggah berkas: ' + res.error, 'Gagal');
          }
        })
        .withFailureHandler(err => {
          App.loading(false);
          App.alert('Terjadi kesalahan koneksi: ' + (err.message || err), 'Error');
        })
        .kanbanUploadAttachment(nsm, base64Data, file.name);
    };
    reader.readAsDataURL(file);
  },

  submitQuickAddLink() {
    const cardId = this.state.quickAddCardId;
    if (!cardId) return;

    const card = this.state.cards.find(c => c.card_id === cardId);
    if (!card) return;

    const nameEl = document.getElementById('quick-add-link-name');
    const urlEl = document.getElementById('quick-add-link-url');
    
    const name = nameEl ? nameEl.value.trim() : '';
    let url = urlEl ? urlEl.value.trim() : '';

    if (!name || !url) {
      App.alert('Nama link dan URL harus diisi.', 'Validation');
      return;
    }

    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    const nsm = App.state.kamad?.nsm;
    if (!nsm) return;

    const newAttachment = {
      type: 'link',
      name: name,
      url: url,
      card_status: card.status
    };

    card.attachments.push(newAttachment);

    App.loading(true, 'Menyimpan link...');

    google.script.run
      .withSuccessHandler(saveRes => {
        App.loading(false);
        if (saveRes.success) {
          if (nameEl) nameEl.value = '';
          if (urlEl) urlEl.value = '';
          App.alert('Tautan berhasil disimpan ke kartu!', 'Sukses');
          this.systemComment(`Menambahkan tautan: ${name}`, cardId);
          this.closeQuickAddModal();
        } else {
          App.alert('Gagal memperbarui data kartu: ' + saveRes.error, 'Gagal');
          card.attachments.pop();
        }
      })
      .withFailureHandler(saveErr => {
        App.loading(false);
        App.alert('Koneksi terputus saat menyimpan kartu: ' + (saveErr.message || saveErr), 'Error');
        card.attachments.pop();
      })
      .kanbanSaveCard(nsm, card);
  }
};

// Central Utility time formatting helper (safe fallback if not exist)
if (typeof Utils === 'undefined') {
  window.Utils = {
    formatTimeAgo: (dateString) => {
      if (!dateString) return '';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      
      if (isNaN(seconds)) return '';
      
      const intervals = {
        'tahun': 31536000,
        'bulan': 2592000,
        'hari': 86400,
        'jam': 3600,
        'menit': 60
      };

      for (let key in intervals) {
        const interval = Math.floor(seconds / intervals[key]);
        if (interval >= 1) {
          return `${interval} ${key} yang lalu`;
        }
      }
      return 'baru saja';
    }
  };
} else if (!Utils.formatTimeAgo) {
  Utils.formatTimeAgo = (dateString) => {
    if (!dateString) return '';
    const date = new Date(dateString);
    const now = new Date();
    const seconds = Math.floor((now - date) / 1000);
    if (isNaN(seconds)) return '';
    const intervals = { 'tahun': 31536000, 'bulan': 2592000, 'hari': 86400, 'jam': 3600, 'menit': 60 };
    for (let key in intervals) {
      const interval = Math.floor(seconds / intervals[key]);
      if (interval >= 1) return `${interval} ${key} yang lalu`;
    }
    return 'baru saja';
  };
}

// Close multiselect dropdown if clicked outside
document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('tag-multiselect-dropdown');
  const multiselect = document.getElementById('tag-multiselect');
  if (dropdown && multiselect) {
    if (!multiselect.contains(e.target)) {
      dropdown.style.display = 'none';
      const trigger = multiselect.querySelector('.multiselect-trigger');
      if (trigger) trigger.classList.remove('active');
    }
  }
});
</script>
