<script>
// ============================================================
// KAMAD DASHBOARD MODULE
// Dashboard utama untuk Kepala Madrasah
// Menampilkan info madrasah, statistik form, dan menu cepat
// ============================================================

const KamadDashboard = {

  // --------------------------------------------------------
  // VIEWS
  // --------------------------------------------------------

  views: {

    /**
     * Skeleton loading state
     */
    skeleton: () => {
      const isSupervisor = !!App.state.isSupervisorViewAs;
      return `
      <div class="header">
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="menu-dropdown">
            <button class="menu-btn" onclick="event.stopPropagation(); document.getElementById('kamad-menu').classList.toggle('show')" title="Menu">☰</button>
            <div id="kamad-menu" class="menu-dropdown-content">
              <div class="menu-item" onclick="App.router('kamad-profile'); document.getElementById('kamad-menu').classList.remove('show')">
                <span class="menu-item-icon">👤</span>
                <span class="menu-item-text">Profil Madrasah</span>
              </div>
              <div class="menu-item" onclick="App.router('kamad-forms'); document.getElementById('kamad-menu').classList.remove('show')">
                <span class="menu-item-icon">📋</span>
                <span class="menu-item-text">Form Instrumen</span>
              </div>
              <div class="menu-item" onclick="App.router('kamad-kanban'); document.getElementById('kamad-menu').classList.remove('show')">
                <span class="menu-item-icon">🎯</span>
                <span class="menu-item-text">Program Kerja</span>
              </div>
              ${isSupervisor ? `
              <div class="menu-item" style="color:var(--color-danger);" onclick="App.exitSupervisorViewAs()">
                <span class="menu-item-icon">🚪</span>
                <span class="menu-item-text">Kembali ke Sasaran</span>
              </div>
              ` : `
              <div class="menu-item" style="color:var(--color-danger);" onclick="KamadAuth.logout()">
                <span class="menu-item-icon">⏏</span>
                <span class="menu-item-text">Logout</span>
              </div>
              `}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="header-page-icon">🏫</div>
            <div>
              <div class="kamad-skeleton" style="width:140px;height:14px;margin-bottom:5px;"></div>
              <div class="kamad-skeleton" style="width:90px;height:11px;"></div>
            </div>
          </div>
        </div>
        ${isSupervisor ? `
        <button class="back-btn" onclick="App.exitSupervisorViewAs()"><span style="font-size:0.9em;">‹</span> Kembali</button>
        ` : ''}
      </div>
      <div class="content">
        <div class="kamad-skeleton" style="width:120px;height:16px;margin:15px 0 10px;"></div>
        <div class="kamad-skeleton kamad-skeleton-card" style="height:70px;margin-bottom:8px;"></div>
        <div class="kamad-skeleton kamad-skeleton-card" style="height:70px;margin-bottom:8px;"></div>
        <div class="kamad-skeleton kamad-skeleton-card" style="height:70px;margin-bottom:8px;"></div>
      </div>
      `;
    },

    /**
     * Konten dashboard penuh setelah data dimuat
     */
    main: (madrasahInfo, stats, recentForms, history) => {
      const isSupervisor = !!App.state.isSupervisorViewAs;
      const nama = madrasahInfo?.nama || madrasahInfo?.name || '—';
      const nsm  = madrasahInfo?.nsm || '—';
      const kec  = madrasahInfo?.kecamatan || madrasahInfo?.subdistrict || '';
      const kab  = madrasahInfo?.kabupaten  || madrasahInfo?.district    || '';
      const loc  = [kec, kab].filter(Boolean).join(', ');

      // Hitung komentar baru yang belum dibaca
      const kanbanData = App.state.kanbanData || { cards: [], comments: [] };
      const currentUserId = isSupervisor ? App.state.user?.NIP : nsm;
      let unreadCommentsCount = 0;
      
      if (kanbanData.comments && kanbanData.comments.length > 0) {
        kanbanData.comments.forEach(comment => {
          const commentAuthorId = String(comment.author_id).trim();
          const meId = String(currentUserId || '').trim();
          
          if (commentAuthorId !== meId) {
            const lastSeenTime = localStorage.getItem(`kanban_card_last_seen_${comment.card_id}`) || '0';
            if (new Date(comment.created_at).getTime() > new Date(lastSeenTime).getTime()) {
              unreadCommentsCount++;
            }
          }
        });
      }

      return `
        <div class="header">
          <div style="display:flex;align-items:center;gap:4px;">
            <div class="menu-dropdown">
              <button class="menu-btn" onclick="event.stopPropagation(); document.getElementById('kamad-menu').classList.toggle('show')" title="Menu">☰</button>
              <div id="kamad-menu" class="menu-dropdown-content">
                <div class="menu-item" onclick="App.router('kamad-data-madrasah'); document.getElementById('kamad-menu').classList.remove('show')">
                  <span class="menu-item-icon">📊</span>
                  <span class="menu-item-text">Data Madrasah</span>
                </div>
                <div class="menu-item" onclick="App.router('kamad-profile'); document.getElementById('kamad-menu').classList.remove('show')">
                  <span class="menu-item-icon">👤</span>
                  <span class="menu-item-text">Profil Madrasah</span>
                </div>
                <div class="menu-item" onclick="App.router('kamad-forms'); document.getElementById('kamad-menu').classList.remove('show')">
                  <span class="menu-item-icon">📋</span>
                  <span class="menu-item-text">Form Instrumen</span>
                </div>
                <div class="menu-item" onclick="App.router('kamad-kanban'); document.getElementById('kamad-menu').classList.remove('show')">
                  <span class="menu-item-icon">🎯</span>
                  <span class="menu-item-text">Program Kerja</span>
                </div>
                <div class="menu-item" onclick="App.router('kamad-materi'); document.getElementById('kamad-menu').classList.remove('show')">
                  <span class="menu-item-icon">📚</span>
                  <span class="menu-item-text">Buku dan Materi Terkait</span>
                </div>
                ${isSupervisor ? `
                <div class="menu-item" style="color:var(--color-danger);" onclick="App.exitSupervisorViewAs()">
                  <span class="menu-item-icon">🚪</span>
                  <span class="menu-item-text">Kembali ke Sasaran</span>
                </div>
                ` : `
                <div class="menu-item" style="color:var(--color-danger);" onclick="KamadAuth.logout()">
                  <span class="menu-item-icon">⏏</span>
                  <span class="menu-item-text">Logout</span>
                </div>
                `}
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="header-page-icon">🏫</div>
              <div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <h1 style="margin:0;font-size:0.95rem;line-height:1.2;font-weight:700;">Menu Madrasah</h1>
                </div>
                <div style="font-size:0.75rem;color:var(--color-text-secondary);opacity:0.9;margin-top:2px;">${nama} · ${nsm}</div>
                ${isSupervisor ? `
                  <div style="margin-top:4px;">
                    <span style="background:rgba(239,68,68,0.1); color:var(--color-danger); font-size:0.65rem; font-weight:700; padding:1px 6px; border-radius:4px; display:inline-flex; align-items:center; height:16px;" title="Anda sedang masuk menggunakan hak akses Pengawas">
                      PENGAWAS
                    </span>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="back-btn" onclick="KamadDashboard.forceRefresh()" style="padding:4px 10px; font-size:1rem; display:flex; align-items:center; justify-content:center; width:34px;" title="Refresh Data">🔄</button>
            ${isSupervisor ? `
            <button class="back-btn" onclick="App.exitSupervisorViewAs()"><span style="font-size:0.9em;">‹</span> Kembali</button>
            ` : ''}
          </div>
        </div>

        <div class="content" style="padding-top:16px;">
          <!-- Profile Card -->
          <div style="background:linear-gradient(135deg,var(--color-primary) 0%,var(--color-primary-dark) 100%);border-radius:16px;padding:18px;margin-bottom:20px;color:white;position:relative;overflow:hidden;">
            <div style="position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.08);pointer-events:none;"></div>
            <div style="position:absolute;bottom:-30px;right:30px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.06);pointer-events:none;"></div>
            <div style="display:flex;gap:14px;align-items:center;position:relative;">
              <div style="width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:1.5em;color:white;font-weight:700;flex-shrink:0;">🏫</div>
              <div style="flex:1;min-width:0;text-align:left;">
                <div style="font-size:1rem;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  ${nama}
                </div>
                <div style="font-size:0.78rem;opacity:0.85;margin-bottom:6px;">NSM: ${nsm}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  <span style="background:rgba(255,255,255,0.2);border-radius:8px;padding:2px 10px;font-size:0.72rem;font-weight:600;">${loc || '—'}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Launchpad Cards Grid (Responsive) -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px;">
            <!-- Card 1: Data Madrasah -->
            <div class="card form-card" onclick="App.router('kamad-data-madrasah')" style="cursor:pointer; display:flex; align-items:center; gap:16px; padding:18px; margin-bottom:0; text-align:left; background:var(--color-bg-elevated); border:1px solid var(--color-border-light); border-radius:var(--radius-lg); transition: all var(--transition-fast);">
              <div style="font-size:2rem; min-width:50px; text-align:center; background:rgba(76, 175, 80, 0.1); border-radius:12px; height:50px; display:flex; align-items:center; justify-content:center; color:#4caf50; flex-shrink:0;">📊</div>
              <div style="flex:1; min-width:0;">
                <h3 style="margin:0 0 4px 0; font-size:0.95rem; font-weight:700; color:var(--color-text);">Data Madrasah</h3>
                <div style="font-size:0.8rem; color:var(--color-text-light); line-height:1.4;">Data asesmen nasional, profil belajar siswa dan data lain</div>
              </div>
            </div>

            <!-- Card 2: Form Instrumen -->
            <div class="card form-card" onclick="App.router('kamad-forms')" style="cursor:pointer; display:flex; align-items:center; gap:16px; padding:18px; margin-bottom:0; text-align:left; background:var(--color-bg-elevated); border:1px solid var(--color-border-light); border-radius:var(--radius-lg); transition: all var(--transition-fast);">
              <div style="font-size:2rem; min-width:50px; text-align:center; background:rgba(26, 115, 232, 0.1); border-radius:12px; height:50px; display:flex; align-items:center; justify-content:center; color:var(--color-primary); flex-shrink:0;">📋</div>
              <div style="flex:1; min-width:0;">
                <h3 style="margin:0 0 4px 0; font-size:0.95rem; font-weight:700; color:var(--color-text);">Form Instrumen</h3>
                <div style="font-size:0.8rem; color:var(--color-text-light); line-height:1.4;">Kuesioner evaluasi, observasi, angket, FGD, dll.</div>
              </div>
            </div>

            <!-- Card 3: Program Kerja -->
            <div class="card form-card" onclick="App.router('kamad-kanban')" style="cursor:pointer; display:flex; align-items:center; gap:16px; padding:18px; margin-bottom:0; text-align:left; background:var(--color-bg-elevated); border:1px solid var(--color-border-light); border-radius:var(--radius-lg); transition: all var(--transition-fast);">
              <div style="font-size:2rem; min-width:50px; text-align:center; background:rgba(239, 68, 68, 0.1); border-radius:12px; height:50px; display:flex; align-items:center; justify-content:center; color:var(--color-accent); flex-shrink:0;">🎯</div>
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <h3 style="margin:0 0 4px 0; font-size:0.95rem; font-weight:700; color:var(--color-text);">Program Kerja</h3>
                  ${unreadCommentsCount > 0 ? `
                    <span style="background:var(--color-accent); color:white; font-size:0.65rem; font-weight:800; padding:2px 8px; border-radius:10px; animation: pulseUnread 1.5s infinite;">
                      ${unreadCommentsCount} BARU
                    </span>` : ''}
                </div>
                <div style="font-size:0.8rem; color:var(--color-text-light); line-height:1.4;">Kanban board kerja & ruang konsultasi ke pengawas.</div>
              </div>
            </div>

            <!-- Card 4: Buku dan Materi Terkait -->
            <div class="card form-card" onclick="App.router('kamad-materi')" style="cursor:pointer; display:flex; align-items:center; gap:16px; padding:18px; margin-bottom:0; text-align:left; background:var(--color-bg-elevated); border:1px solid var(--color-border-light); border-radius:var(--radius-lg); transition: all var(--transition-fast);">
              <div style="font-size:2rem; min-width:50px; text-align:center; background:rgba(63, 81, 181, 0.1); border-radius:12px; height:50px; display:flex; align-items:center; justify-content:center; color:#3f51b5; flex-shrink:0;">📚</div>
              <div style="flex:1; min-width:0;">
                <h3 style="margin:0 0 4px 0; font-size:0.95rem; font-weight:700; color:var(--color-text);">Buku dan Materi Terkait</h3>
                <div style="font-size:0.8rem; color:var(--color-text-light); line-height:1.4;">Akses dari daftar buku dan materi Madrasah.</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }
  },

  // --------------------------------------------------------
  // ACCORDION SECTIONS
  // --------------------------------------------------------

  toggleSection(section) {
    const formsContent = document.getElementById('section-content-forms');
    const programContent = document.getElementById('section-content-program');
    const formsChevron = document.getElementById('chevron-forms');
    const programChevron = document.getElementById('chevron-program');
    
    if (!formsContent || !programContent) return;
    
    const showForms = section === 'forms' && formsContent.style.display === 'none';
    const showProgram = section === 'program' && programContent.style.display === 'none';
    
    // Collapse all
    formsContent.style.display = 'none';
    programContent.style.display = 'none';
    if (formsChevron) formsChevron.style.transform = 'rotate(0deg)';
    if (programChevron) programChevron.style.transform = 'rotate(0deg)';
    
    // Expand active
    if (showForms) {
      formsContent.style.display = 'block';
      if (formsChevron) formsChevron.style.transform = 'rotate(90deg)';
      sessionStorage.setItem('kamad_dashboard_active_section', 'forms');
    } else if (showProgram) {
      programContent.style.display = 'block';
      if (programChevron) programChevron.style.transform = 'rotate(90deg)';
      sessionStorage.setItem('kamad_dashboard_active_section', 'program');
    } else {
      sessionStorage.removeItem('kamad_dashboard_active_section');
    }
  },

  toggleAccordion(e, listId, formId) {
    if (e && e.stopPropagation) e.stopPropagation();
    const details = document.getElementById(listId);
    const chevron = document.getElementById(`chevron-${formId}`);
    if (details) {
      const isOpen = details.style.display !== 'none';
      details.style.display = isOpen ? 'none' : 'block';
      if (chevron) {
        chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
      }
    }
  },

  // --------------------------------------------------------
  // LIFECYCLE
  // --------------------------------------------------------

  init() {
    const el = document.getElementById('app');
    const nsm = App.state.kamad?.nsm;
    if (!nsm) { App.router('kamad-login'); return; }

    // Jika data dashboard sudah ada di App.state (memori lokal), render seketika tanpa loading server
    if (App.state.kamad?.madrasahInfo) {
      el.innerHTML = KamadDashboard.views.main(
        App.state.kamad.madrasahInfo,
        App.state.kamadStats || {},
        App.state.kamadForms || [],
        App.state.kamadHistory || []
      );
      return;
    }

    el.innerHTML = KamadDashboard.views.skeleton();
    // Load dashboard data
    App.loading(true, 'Memuat dashboard...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          App.state.kamad = App.state.kamad || {};
          App.state.kamad.madrasahInfo = res.data.madrasahInfo;
          App.state.kamadStats = res.data.stats || {};
          App.state.kamadForms = res.data.forms || [];
          App.state.kamadHistory = res.data.history || [];
          App.state.kanbanData = res.data.kanbanData || { cards: [], comments: [] };
          App.state.my_tokens = res.data.my_tokens || [];
          el.innerHTML = KamadDashboard.views.main(
            res.data.madrasahInfo,
            res.data.stats,
            res.data.forms,
            res.data.history
          );
        } else {
          el.innerHTML = `<div class="content"><div class="card" style="text-align:center;padding:40px;color:var(--color-text-secondary);">Gagal memuat: ${res.error}</div></div>`;
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        el.innerHTML = `<div class="content"><div class="card" style="text-align:center;padding:40px;color:var(--color-accent);">Koneksi terputus: ${err.message || err}</div></div>`;
      })
      .kamadGetDashboard(nsm, App.state.isSupervisorViewAs ? 'district' : 'madrasah', false);
  },

  forceRefresh() {
    const el = document.getElementById('app');
    el.innerHTML = KamadDashboard.views.skeleton();

    const nsm = App.state.kamad?.nsm;
    if (!nsm) { App.router('kamad-login'); return; }

    App.loading(true, 'Memperbarui data dashboard...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          App.state.kamad = App.state.kamad || {};
          App.state.kamad.madrasahInfo = res.data.madrasahInfo;
          App.state.kamadStats = res.data.stats || {};
          App.state.kamadForms = res.data.forms || [];
          App.state.kamadHistory = res.data.history || [];
          App.state.kanbanData = res.data.kanbanData || { cards: [], comments: [] };
          App.state.my_tokens = res.data.my_tokens || [];
          el.innerHTML = KamadDashboard.views.main(
            res.data.madrasahInfo,
            res.data.stats,
            res.data.forms,
            res.data.history
          );
          App.toast('Dashboard diperbarui');
        } else {
          el.innerHTML = `<div class="content"><div class="card" style="text-align:center;padding:40px;color:var(--color-text-secondary);">Gagal memuat: ${res.error}</div></div>`;
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        el.innerHTML = `<div class="content"><div class="card" style="text-align:center;padding:40px;color:var(--color-accent);">Koneksi terputus: ${err.message || err}</div></div>`;
      })
      .kamadGetDashboard(nsm, App.state.isSupervisorViewAs ? 'district' : 'madrasah', true);
  },

  // --------------------------------------------------------
  // MENU DROPDOWN
  // --------------------------------------------------------

  toggleMenu(btn) {
    const menu = document.getElementById('kamad-dash-menu');
    if (!menu) return;
    const isOpen = menu.classList.contains('open');
    this.closeMenu();
    if (!isOpen) {
      menu.classList.add('open');
      // Close on outside click
      setTimeout(() => {
        document.addEventListener('click', KamadDashboard._outsideClick, { once: true });
      }, 10);
    }
  },

  closeMenu() {
    document.querySelectorAll('.kamad-dropdown.open').forEach(m => m.classList.remove('open'));
  },

  _outsideClick() {
    KamadDashboard.closeMenu();
  }
};
</script>
