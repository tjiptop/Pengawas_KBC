<script>
// ============================================================
// DATA MADRASAH VIEW & MANAGER (PBS Summary)
// ============================================================

const KamadDataViews = {
  Main: () => `
    <div class="header">
      <div class="header-title-wrap">
        <div class="header-page-icon">📊</div>
        <h1>Data Madrasah</h1>
      </div>
      <button class="back-btn" onclick="App.router('kamad-dashboard')"><span style="font-size:0.9em;">‹</span> Kembali</button>
    </div>
    <div class="content" style="padding-top:16px;">
      <!-- Main Card Panel -->
      <div class="card" style="padding:20px; border-radius:12px; background:var(--color-bg-elevated); border:1px solid var(--color-border-light); box-shadow:var(--shadow-sm);">
        <h2 style="margin:0 0 8px 0; font-size:1.1rem; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:8px;">
          🩺 Profil Belajar Siswa (PBS)
        </h2>
        <p style="margin:0 0 20px 0; font-size:0.85rem; color:var(--color-text-secondary); line-height:1.5;">
          Rekapitulasi perkembangan, kondisi kesulitan belajar, serta kebutuhan alat bantu siswa di madrasah ini yang tercatat dalam sistem PBS (Profil Belajar Siswa).
        </p>

        <!-- Section 1: Ragam Kesulitan -->
        <h3 style="margin:24px 0 12px 0; font-size:0.95rem; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:6px;">
          📌 Ragam Kesulitan
        </h3>
        <div class="table-responsive" style="margin-bottom:24px;">
          <table class="data-table-pbs" style="width:100%; border-collapse:collapse; text-align:left; font-size:0.88rem;">
            <thead>
              <tr style="border-bottom:2px solid var(--color-border); background:var(--color-bg); color:var(--color-text);">
                <th style="padding:12px 16px; font-weight:700;">Macam Kesulitan</th>
                <th style="padding:12px 16px; font-weight:700; text-align:center; width:25%;">Sedikit Kesulitan</th>
                <th style="padding:12px 16px; font-weight:700; text-align:center; width:25%;">Banyak Kesulitan</th>
                <th style="padding:12px 16px; font-weight:700; text-align:center; width:25%;">Tidak Bisa Sama Sekali</th>
              </tr>
            </thead>
            <tbody id="pbs-table-body">
              <tr>
                <td colspan="4" style="padding:30px; text-align:center; color:var(--color-text-light);">Memuat data rekapitulasi PBS...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Section 2: Kebutuhan Alat Bantu -->
        <h3 style="margin:24px 0 12px 0; font-size:0.95rem; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:6px;">
          ♿ Kebutuhan Alat Bantu
        </h3>
        <div class="table-responsive">
          <table class="data-table-pbs" style="width:100%; border-collapse:collapse; text-align:left; font-size:0.88rem;">
            <thead>
              <tr style="border-bottom:2px solid var(--color-border); background:var(--color-bg); color:var(--color-text);">
                <th style="padding:12px 16px; font-weight:700;">Alat Bantu</th>
                <th style="padding:12px 16px; font-weight:700; text-align:center; width:28%;">Dibutuhkan tapi Belum Memiliki</th>
                <th style="padding:12px 16px; font-weight:700; text-align:center; width:28%;">Dibutuhkan & Sudah Memiliki</th>
                <th style="padding:12px 16px; font-weight:700; text-align:center; width:15%;">Tidak Tahu</th>
              </tr>
            </thead>
            <tbody id="alat-table-body">
              <tr>
                <td colspan="4" style="padding:30px; text-align:center; color:var(--color-text-light);">Memuat data kebutuhan alat bantu...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `,

  EmptyRow: (cols) => `
    <tr>
      <td colspan="${cols}" style="padding:40px; text-align:center; color:var(--color-text-light);">
        <div style="font-size:2rem; margin-bottom:8px;">📊</div>
        Belum ada data yang tercatat untuk madrasah ini.
      </td>
    </tr>
  `
};

const KamadDataManager = {
  state: {
    kesulitan: [],
    alat_bantu: []
  },

  init() {
    this.loadPbsData();
  },

  loadPbsData() {
    const nsm = App.state.kamad?.nsm || App.state.user?.username;
    if (!nsm) {
      const errMsg = `
        <tr>
          <td colspan="4" style="padding:20px; text-align:center; color:var(--color-danger);">
            Gagal memuat data: Sesi/NSM tidak valid.
          </td>
        </tr>
      `;
      document.getElementById('pbs-table-body').innerHTML = errMsg;
      document.getElementById('alat-table-body').innerHTML = errMsg;
      return;
    }

    App.loading(true, 'Memuat data PBS...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          this.state.kesulitan = res.data.kesulitan || [];
          this.state.alat_bantu = res.data.alat_bantu || [];
          this.render();
        } else {
          const errMsg = `
            <tr>
              <td colspan="4" style="padding:20px; text-align:center; color:var(--color-danger);">
                Gagal memuat data: ${res.error}
              </td>
            </tr>
          `;
          document.getElementById('pbs-table-body').innerHTML = errMsg;
          document.getElementById('alat-table-body').innerHTML = errMsg;
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        const errMsg = `
          <tr>
            <td colspan="4" style="padding:20px; text-align:center; color:var(--color-danger);">
              Koneksi terputus: ${err.message || err}
            </td>
          </tr>
        `;
        document.getElementById('pbs-table-body').innerHTML = errMsg;
        document.getElementById('alat-table-body').innerHTML = errMsg;
      })
      .getKamadPbsSummary(nsm);
  },

  render() {
    const pbsBody = document.getElementById('pbs-table-body');
    const alatBody = document.getElementById('alat-table-body');
    if (!pbsBody || !alatBody) return;

    const showCount = (val) => val > 0 ? `<span class="badge-count">${val}</span>` : `<span style="color:var(--color-text-light); opacity:0.5;">-</span>`;

    // 1. Render Tabel Kesulitan
    if (this.state.kesulitan.length === 0) {
      pbsBody.innerHTML = KamadDataViews.EmptyRow(4);
    } else {
      let pbsHtml = '';
      this.state.kesulitan.forEach(row => {
        pbsHtml += `
          <tr class="pbs-row-item" style="border-bottom:1px solid var(--color-border-light);">
            <td style="padding:14px 16px; font-weight:600; color:var(--color-text);">${row.kesulitan}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-primary);">${showCount(row.sedikit_kesulitan)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-accent);">${showCount(row.banyak_kesulitan)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-danger);">${showCount(row.tidak_bisa_sama_sekali)}</td>
          </tr>
        `;
      });
      pbsBody.innerHTML = pbsHtml;
    }

    // 2. Render Tabel Alat Bantu
    if (this.state.alat_bantu.length === 0) {
      alatBody.innerHTML = KamadDataViews.EmptyRow(4);
    } else {
      let alatHtml = '';
      this.state.alat_bantu.forEach(row => {
        alatHtml += `
          <tr class="pbs-row-item" style="border-bottom:1px solid var(--color-border-light);">
            <td style="padding:14px 16px; font-weight:600; color:var(--color-text);">${row.alat}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-accent);">${showCount(row.dibutuhkan_tidak_memiliki)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-success);">${showCount(row.dibutuhkan_sudah_memiliki)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-text-light);">${showCount(row.tidak_tahu)}</td>
          </tr>
        `;
      });
      alatBody.innerHTML = alatHtml;
    }
  }
};
</script>

<style>
  /* Styling Tabel PBS */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 8px;
    border: 1px solid var(--color-border-light);
  }
  .data-table-pbs {
    background: transparent;
  }
  .pbs-row-item {
    transition: background-color var(--transition-fast);
  }
  .pbs-row-item:hover {
    background-color: var(--color-bg-hover);
  }
  .badge-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.05);
    font-size: 0.8rem;
    font-weight: 700;
    color: inherit;
  }
  [data-theme="dark"] .badge-count {
    background: rgba(255, 255, 255, 0.08);
  }
</style>
