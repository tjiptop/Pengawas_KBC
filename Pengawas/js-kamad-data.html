<script>
// ============================================================
// DATA MADRASAH VIEW & MANAGER (PBS & ANBK Summary)
// ============================================================

const KamadDataViews = {
  Main: () => `
    <div class="header">
      <div class="header-title-wrap">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="header-page-icon">📊</div>
          <div>
            <div style="display:flex;align-items:center;gap:6px;">
              <h1 style="margin:0;font-size:0.95rem;line-height:1.2;font-weight:700;">Data Madrasah</h1>
            </div>
            <div style="font-size:0.7rem;color:var(--color-text-secondary);opacity:0.85;margin-top:2px;">${App.state.kamad?.madrasah_name || 'Madrasah Anda'}</div>
            ${!!App.state.isSupervisorViewAs ? `
              <div style="margin-top:4px;">
                <span style="background:rgba(239,68,68,0.1); color:var(--color-danger); font-size:0.65rem; font-weight:700; padding:1px 6px; border-radius:4px; display:inline-flex; align-items:center; height:16px;" title="Anda sedang masuk menggunakan hak akses Pengawas">
                  PENGAWAS
                </span>
              </div>` : ''}
          </div>
        </div>
      </div>
      <button class="back-btn" onclick="App.router('kamad-dashboard')"><span style="font-size:0.9em;">‹</span> Kembali</button>
    </div>
    <div class="content" style="padding-top:16px;">
      
      <!-- Card 1: Asesmen Nasional (ANBK) Accordion -->
      <div class="card" style="padding:0; border-radius:12px; background:var(--color-bg-elevated); border:1px solid var(--color-border-light); box-shadow:var(--shadow-sm); margin-bottom:20px; overflow:hidden;">
        <!-- Header / Trigger -->
        <div onclick="KamadDataManager.toggleAnbk()" style="padding:18px 20px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:background-color var(--transition-fast);" class="anbk-header-trigger">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:1.25rem;">📈</span>
            <h2 style="margin:0; font-size:1.1rem; font-weight:700; color:var(--color-text);">Asesmen Nasional (ANBK)</h2>
          </div>
          <span id="anbk-arrow" style="font-size:1rem; font-weight:700; color:var(--color-text-secondary); transition:transform 0.3s ease-in-out;">▼</span>
        </div>
        <!-- Content -->
        <div id="anbk-content" style="max-height:0; overflow:hidden; transition:max-height 0.3s ease-out, border-top 0.2s; border-top:0px solid var(--color-border-light);">
          <div style="padding:20px;">
            <p style="margin:0 0 20px 0; font-size:0.85rem; color:var(--color-text-secondary); line-height:1.5;">
              Berikut adalah nilai hasil Asesmen Nasional Berbasis Komputer (ANBK) madrasah ini yang meliputi literasi, numerasi, karakter, kualitas pembelajaran, serta iklim sekolah.
            </p>
            <div id="anbk-indicators-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:12px;">
              <div style="grid-column:1/-1; padding:10px; text-align:center; color:var(--color-text-light);">Memuat data ANBK...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 2: Profil Belajar Siswa (PBS) Accordion -->
      <div class="card" style="padding:0; border-radius:12px; background:var(--color-bg-elevated); border:1px solid var(--color-border-light); box-shadow:var(--shadow-sm); overflow:hidden;">
        <!-- Header / Trigger -->
        <div onclick="KamadDataManager.togglePbs()" style="padding:18px 20px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:background-color var(--transition-fast);" class="anbk-header-trigger">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:1.25rem;">🩺</span>
            <h2 style="margin:0; font-size:1.1rem; font-weight:700; color:var(--color-text);">Profil Belajar Siswa (PBS)</h2>
          </div>
          <span id="pbs-arrow" style="font-size:1rem; font-weight:700; color:var(--color-text-secondary); transition:transform 0.3s ease-in-out;">▼</span>
        </div>
        <!-- Content -->
        <div id="pbs-content" style="max-height:0; overflow:hidden; transition:max-height 0.3s ease-out, border-top 0.2s; border-top:0px solid var(--color-border-light);">
          <div style="padding:20px;">
            <p style="margin:0 0 16px 0; font-size:0.85rem; color:var(--color-text-secondary); line-height:1.5;">
              Rekapitulasi perkembangan, kondisi kesulitan belajar, kebutuhan alat bantu, serta penyesuaian pembelajaran siswa di madrasah ini yang tercatat dalam sistem PBS (Profil Belajar Siswa).
            </p>

            <!-- Stats Indicators -->
            <div style="display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap;">
              <div style="background:var(--color-bg); padding:10px 18px; border-radius:8px; border:1px solid var(--color-border-light); display:flex; flex-direction:column; gap:4px; min-width:120px; box-shadow:var(--shadow-sm);">
                <span style="font-size:0.75rem; color:var(--color-text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Total Siswa</span>
                <span id="pbs-total-siswa" style="font-size:1.4rem; font-weight:800; color:var(--color-text);">-</span>
              </div>
              <div style="background:var(--color-bg); padding:10px 18px; border-radius:8px; border:1px solid var(--color-border-light); display:flex; flex-direction:column; gap:4px; min-width:120px; box-shadow:var(--shadow-sm);">
                <span style="font-size:0.75rem; color:var(--color-text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Laki-laki (L)</span>
                <span id="pbs-siswa-l" style="font-size:1.4rem; font-weight:800; color:var(--color-primary);">-</span>
              </div>
              <div style="background:var(--color-bg); padding:10px 18px; border-radius:8px; border:1px solid var(--color-border-light); display:flex; flex-direction:column; gap:4px; min-width:120px; box-shadow:var(--shadow-sm);">
                <span style="font-size:0.75rem; color:var(--color-text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Perempuan (P)</span>
                <span id="pbs-siswa-p" style="font-size:1.4rem; font-weight:800; color:var(--color-accent);">-</span>
              </div>
            </div>

            <!-- Section 1: Ragam Kesulitan -->
            <h3 style="margin:24px 0 12px 0; font-size:0.95rem; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:6px;">
              📌 Ragam Kesulitan
            </h3>
            <div class="table-responsive" style="margin-bottom:28px;">
              <table class="data-table-pbs" style="width:100%; border-collapse:collapse; text-align:left; font-size:0.88rem;">
                <thead>
                  <tr style="border-bottom:2px solid var(--color-border); background:var(--color-bg); color:var(--color-text);">
                    <th style="padding:12px 16px; font-weight:700;">Macam Kesulitan</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:25%;">Sedikit Kesulitan</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:25%;">Banyak Kesulitan</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:25%;">Tidak Bisa Sama Sekali</th>
                  </tr>
                </thead>
                <tbody id="pbs-table-body">
                  <tr>
                    <td colspan="4" style="padding:30px; text-align:center; color:var(--color-text-light);">Memuat data rekapitulasi PBS...</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Section 2: Kebutuhan Alat Bantu -->
            <h3 style="margin:24px 0 12px 0; font-size:0.95rem; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:6px;">
              ♿ Kebutuhan Alat Bantu
            </h3>
            <div class="table-responsive" style="margin-bottom:28px;">
              <table class="data-table-pbs" style="width:100%; border-collapse:collapse; text-align:left; font-size:0.88rem;">
                <thead>
                  <tr style="border-bottom:2px solid var(--color-border); background:var(--color-bg); color:var(--color-text);">
                    <th style="padding:12px 16px; font-weight:700;">Alat Bantu</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:28%;">Dibutuhkan tapi Belum Memiliki</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:28%;">Dibutuhkan & Sudah Memiliki</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:15%;">Tidak Tahu</th>
                  </tr>
                </thead>
                <tbody id="alat-table-body">
                  <tr>
                    <td colspan="4" style="padding:30px; text-align:center; color:var(--color-text-light);">Memuat data kebutuhan alat bantu...</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Section 3: Kebutuhan Penyesuaian -->
            <h3 style="margin:24px 0 12px 0; font-size:0.95rem; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:6px;">
              🛠️ Kebutuhan Penyesuaian
            </h3>
            <div class="table-responsive">
              <table class="data-table-pbs" style="width:100%; border-collapse:collapse; text-align:left; font-size:0.88rem;">
                <thead>
                  <tr style="border-bottom:2px solid var(--color-border); background:var(--color-bg); color:var(--color-text);">
                    <th style="padding:12px 16px; font-weight:700;">Penyesuaian</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:28%;">Sudah Melakukan Penyesuaian</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:28%;">Belum, tetapi Akan Melakukan</th>
                    <th style="padding:12px 16px; font-weight:700; text-align:center; width:28%;">Belum Dapat Dilakukan (Keterbatasan Daya)</th>
                  </tr>
                </thead>
                <tbody id="adjust-table-body">
                  <tr>
                    <td colspan="4" style="padding:30px; text-align:center; color:var(--color-text-light);">Memuat data kebutuhan penyesuaian...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  `,

  EmptyRow: (cols) => `
    <tr>
      <td colspan="${cols}" style="padding:40px; text-align:center; color:var(--color-text-light);">
        <div style="font-size:2rem; margin-bottom:8px;">📊</div>
        Belum ada data yang tercatat untuk madrasah ini.
      </td>
    </tr>
  `
};

const KamadDataManager = {
  state: {
    kesulitan: [],
    alat_bantu: [],
    penyesuaian: [],
    stats: { total: 0, l: 0, p: 0 },
    anbk: []
  },

  init() {
    this.loadDataCombined();
  },

  loadDataCombined() {
    const nsm = App.state.kamad?.nsm || App.state.user?.username;
    if (!nsm) {
      const errMsg = `
        <tr>
          <td colspan="4" style="padding:20px; text-align:center; color:var(--color-danger);">
            Gagal memuat data: Sesi/NSM tidak valid.
          </td>
        </tr>
      `;
      document.getElementById('pbs-table-body').innerHTML = errMsg;
      document.getElementById('alat-table-body').innerHTML = errMsg;
      document.getElementById('adjust-table-body').innerHTML = errMsg;
      document.getElementById('anbk-indicators-grid').innerHTML = `
        <div style="grid-column:1/-1; padding:20px; text-align:center; color:var(--color-danger);">
          Gagal memuat data: Sesi/NSM tidak valid.
        </div>
      `;
      return;
    }

    App.loading(true, 'Memuat data Madrasah...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          const pbs = res.data.pbs || {};
          this.state.kesulitan = pbs.kesulitan || [];
          this.state.alat_bantu = pbs.alat_bantu || [];
          this.state.penyesuaian = pbs.penyesuaian || [];
          this.state.stats = pbs.stats || { total: 0, l: 0, p: 0 };
          this.state.anbk = res.data.anbk || [];
          this.render();
        } else {
          const errMsg = `
            <tr>
              <td colspan="4" style="padding:20px; text-align:center; color:var(--color-danger);">
                Gagal memuat data: ${res.error}
              </td>
            </tr>
          `;
          document.getElementById('pbs-table-body').innerHTML = errMsg;
          document.getElementById('alat-table-body').innerHTML = errMsg;
          document.getElementById('adjust-table-body').innerHTML = errMsg;
          document.getElementById('anbk-indicators-grid').innerHTML = `
            <div style="grid-column:1/-1; padding:20px; text-align:center; color:var(--color-danger);">
              Gagal memuat data: ${res.error}
            </div>
          `;
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        const errMsg = `
          <tr>
            <td colspan="4" style="padding:20px; text-align:center; color:var(--color-danger);">
              Koneksi terputus: ${err.message || err}
            </td>
          </tr>
        `;
        document.getElementById('pbs-table-body').innerHTML = errMsg;
        document.getElementById('alat-table-body').innerHTML = errMsg;
        document.getElementById('adjust-table-body').innerHTML = errMsg;
        document.getElementById('anbk-indicators-grid').innerHTML = `
          <div style="grid-column:1/-1; padding:20px; text-align:center; color:var(--color-danger);">
            Koneksi terputus: ${err.message || err}
          </div>
        `;
      })
      .getKamadDataMadrasahCombined(nsm);
  },

  toggleAnbk() {
    const content = document.getElementById('anbk-content');
    const arrow = document.getElementById('anbk-arrow');
    if (content.style.maxHeight && content.style.maxHeight !== '0px') {
      content.style.maxHeight = '0px';
      content.style.borderTop = '0px solid var(--color-border-light)';
      arrow.style.transform = 'rotate(0deg)';
    } else {
      content.style.maxHeight = content.scrollHeight + 'px';
      content.style.borderTop = '1px solid var(--color-border-light)';
      arrow.style.transform = 'rotate(180deg)';
    }
  },

  togglePbs() {
    const content = document.getElementById('pbs-content');
    const arrow = document.getElementById('pbs-arrow');
    if (content.style.maxHeight && content.style.maxHeight !== '0px') {
      content.style.maxHeight = '0px';
      content.style.borderTop = '0px solid var(--color-border-light)';
      arrow.style.transform = 'rotate(0deg)';
    } else {
      content.style.maxHeight = content.scrollHeight + 'px';
      content.style.borderTop = '1px solid var(--color-border-light)';
      arrow.style.transform = 'rotate(180deg)';
    }
  },

  render() {
    // 0. Render Stats
    const stats = this.state.stats || { total: 0, l: 0, p: 0 };
    document.getElementById('pbs-total-siswa').textContent = stats.total;
    document.getElementById('pbs-siswa-l').textContent = stats.l;
    document.getElementById('pbs-siswa-p').textContent = stats.p;

    // 0b. Render ANBK
    const anbkGrid = document.getElementById('anbk-indicators-grid');
    if (anbkGrid) {
      if (this.state.anbk.length === 0) {
        anbkGrid.innerHTML = `
          <div style="grid-column:1/-1; padding:30px; text-align:center; color:var(--color-text-light);">
            <div style="font-size:2rem; margin-bottom:8px;">📊</div>
            Belum ada data ANBK yang tercatat untuk madrasah ini.
          </div>
        `;
      } else {
        let anbkHtml = '';
        this.state.anbk.forEach(item => {
          anbkHtml += `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--color-bg); border:1px solid var(--color-border-light); border-radius:8px; gap:12px;">
              <span style="font-size:0.82rem; font-weight:600; color:var(--color-text); line-height:1.4;">${item.label}</span>
              <span style="font-size:0.85rem; font-weight:700; color:var(--color-primary); background:rgba(26, 115, 232, 0.08); padding:4px 8px; border-radius:6px; white-space:nowrap;">${item.value}</span>
            </div>
          `;
        });
        anbkGrid.innerHTML = anbkHtml;
      }
    }

    const pbsBody = document.getElementById('pbs-table-body');
    const alatBody = document.getElementById('alat-table-body');
    const adjustBody = document.getElementById('adjust-table-body');
    if (!pbsBody || !alatBody || !adjustBody) return;

    const showCount = (val) => val > 0 ? `<span class="badge-count">${val}</span>` : `<span style="color:var(--color-text-light); opacity:0.5;">-</span>`;

    // 1. Render Tabel Kesulitan
    if (this.state.kesulitan.length === 0) {
      pbsBody.innerHTML = KamadDataViews.EmptyRow(4);
    } else {
      let pbsHtml = '';
      this.state.kesulitan.forEach(row => {
        pbsHtml += `
          <tr class="pbs-row-item" style="border-bottom:1px solid var(--color-border-light);">
            <td style="padding:14px 16px; font-weight:600; color:var(--color-text);">${row.kesulitan}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-primary);">${showCount(row.sedikit_kesulitan)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-accent);">${showCount(row.banyak_kesulitan)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-danger);">${showCount(row.tidak_bisa_sama_sekali)}</td>
          </tr>
        `;
      });
      pbsBody.innerHTML = pbsHtml;
    }

    // 2. Render Tabel Alat Bantu
    if (this.state.alat_bantu.length === 0) {
      alatBody.innerHTML = KamadDataViews.EmptyRow(4);
    } else {
      let alatHtml = '';
      this.state.alat_bantu.forEach(row => {
        alatHtml += `
          <tr class="pbs-row-item" style="border-bottom:1px solid var(--color-border-light);">
            <td style="padding:14px 16px; font-weight:600; color:var(--color-text);">${row.alat}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-accent);">${showCount(row.dibutuhkan_tidak_memiliki)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-success);">${showCount(row.dibutuhkan_sudah_memiliki)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-text-light);">${showCount(row.tidak_tahu)}</td>
          </tr>
        `;
      });
      alatBody.innerHTML = alatHtml;
    }

    // 3. Render Tabel Penyesuaian
    if (this.state.penyesuaian.length === 0) {
      adjustBody.innerHTML = KamadDataViews.EmptyRow(4);
    } else {
      let adjustHtml = '';
      this.state.penyesuaian.forEach(row => {
        adjustHtml += `
          <tr class="pbs-row-item" style="border-bottom:1px solid var(--color-border-light);">
            <td style="padding:14px 16px; font-weight:600; color:var(--color-text);">${row.penyesuaian}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-success);">${showCount(row.sudah)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-primary);">${showCount(row.belum)}</td>
            <td style="padding:14px 16px; text-align:center; color:var(--color-danger);">${showCount(row.bantuan)}</td>
          </tr>
        `;
      });
      adjustBody.innerHTML = adjustHtml;
    }
  }
};
</script>

<style>
  /* Styling Accordion ANBK & PBS */
  .anbk-header-trigger {
    background-color: transparent;
  }
  .anbk-header-trigger:hover {
    background-color: var(--color-bg-hover);
  }

  /* Styling Tabel PBS */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 8px;
    border: 1px solid var(--color-border-light);
  }
  .data-table-pbs {
    background: transparent;
  }
  .pbs-row-item {
    transition: background-color var(--transition-fast);
  }
  .pbs-row-item:hover {
    background-color: var(--color-bg-hover);
  }
  .badge-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.05);
    font-size: 0.8rem;
    font-weight: 700;
    color: inherit;
  }
  [data-theme="dark"] .badge-count {
    background: rgba(255, 255, 255, 0.08);
  }
</style>
