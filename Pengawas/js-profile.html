window.ProfileManager = {
    activeTab: 'pelatihan',

    switchTab(tabName) {
        this.activeTab = tabName;
        
        const tabs = ['pelatihan', 'penghargaan', 'mastertrainer', 'edit'];
        tabs.forEach(t => {
            const btn = document.getElementById(`prof-tab-btn-${t}`);
            const content = document.getElementById(`prof-tab-content-${t}`);
            if (btn && content) {
                if (t === tabName) {
                    btn.classList.add('active');
                    btn.style.borderBottomColor = 'var(--color-primary)';
                    btn.style.color = 'var(--color-primary)';
                    content.style.display = 'block';
                } else {
                    btn.classList.remove('active');
                    btn.style.borderBottomColor = 'transparent';
                    btn.style.color = 'var(--color-text-light)';
                    content.style.display = 'none';
                }
            }
        });

        if (tabName === 'pelatihan') {
            this.loadPelatihan();
        } else if (tabName === 'penghargaan') {
            this.loadPenghargaan();
        } else if (tabName === 'mastertrainer') {
            this.loadMasterTrainer();
        } else if (tabName === 'edit') {
            setTimeout(() => this.updateKabupaten(), 0);
        }
    },

    updateKabupaten() {
        const provEl = document.getElementById('prof-provinsi');
        const kabEl = document.getElementById('prof-kabupaten');
        if (!provEl || !kabEl) return;
        const selectedProv = provEl.value;
        
        const rawSelected = kabEl.getAttribute('data-selected') || '';
        const textarea = document.createElement('textarea');
        textarea.innerHTML = rawSelected;
        const previousKab = textarea.value;

        kabEl.innerHTML = '\x3Coption value="">Pilih Kabupaten...\x3C/option>';
        if (selectedProv && DataWilayah[selectedProv]) {
            DataWilayah[selectedProv].forEach(kab => {
                let displayKab = kab.replace(/^(Kab\.|Kabupaten)\s+/i, '');
                let selected = (displayKab === previousKab || kab === previousKab) ? 'selected' : '';
                kabEl.innerHTML += `\x3Coption value="${displayKab}" ${selected}>${displayKab}\x3C/option>`;
            });
        }
    },

    previewFoto(input) {
        if (input.files && input.files[0]) {
            let file = input.files[0];
            let reader = new FileReader();
            
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    const MAX_SIZE = 800;
                    const QUALITY = 0.70;
                    let w = img.width;
                    let h = img.height;
                    
                    if (w > h) {
                        if (w > MAX_SIZE) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; }
                    } else {
                        if (h > MAX_SIZE) { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; }
                    }
                    
                    let canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    let compressedBase64 = canvas.toDataURL('image/jpeg', QUALITY);
                    
                    let previewEl = document.getElementById('preview-foto');
                    previewEl.src = compressedBase64;
                    previewEl.style.display = 'block';
                    
                    document.getElementById('prof-foto-base64').value = compressedBase64;
                    document.getElementById('prof-foto-filename').value = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    },

    save() {
        try {
            const jenjangBoxes = document.querySelectorAll('input[name="prof-jenjang"]:checked');
            const jenjang = Array.from(jenjangBoxes).map(cb => cb.value).join(', ');

            if (!jenjang) return App.alert('Pilih minimal satu jenjang.', 'Validasi');

            const nip = document.getElementById('prof-nip').value;
            const payload = {
                'NIP': nip,
                'Nama': document.getElementById('prof-nama').value,
                'Kelamin': document.getElementById('prof-kelamin').value,
                'Tempat Lahir': document.getElementById('prof-tempat-lahir').value,
                'Tanggal Lahir': document.getElementById('prof-tgl-lahir').value,
                'Golongan': document.getElementById('prof-golongan').value,
                'Provinsi': document.getElementById('prof-provinsi').value,
                'Kabupaten': document.getElementById('prof-kabupaten').value,
                'Jenjang': jenjang,
                'WA': document.getElementById('prof-wa').value,
                'Email': document.getElementById('prof-email').value,
                'Alamat': document.getElementById('prof-alamat').value
            };

            const fotoBase64 = document.getElementById('prof-foto-base64').value;
            const fotoFilename = document.getElementById('prof-foto-filename').value;

            App.loading(true, 'Menyimpan profil...');

            if (fotoBase64) {
                App.loading(true, 'Mengunggah foto...');
                google.script.run.withSuccessHandler(res => {
                    if (res.success) {
                        payload['Foto URL'] = res.data.url;
                        this.saveData(payload);
                    } else {
                        App.loading(false);
                        App.alert('Gagal unggah foto: ' + (res.error || res.message), 'Error');
                    }
                }).withFailureHandler(err => {
                    App.loading(false);
                    App.alert(err.message, 'System Error');
                }).uploadPhoto(nip, fotoBase64, fotoFilename);
            } else {
                this.saveData(payload);
            }
        } catch (e) {
            App.loading(false);
            App.alert('Error di save(): ' + e.message, 'JS Error');
        }
    },

    saveData(payload) {
        try {
            App.loading(true, 'Menyimpan data...');
            google.script.run.withSuccessHandler(res => {
                try {
                    App.loading(false);
                    if (res.success) {
                        const updatedProfile = res.data || payload;
                        App.state.user = updatedProfile;
                        localStorage.setItem('pengawas_user', JSON.stringify(updatedProfile));
                        App.alert('Profil berhasil diperbarui.', 'Berhasil', () => {
                            if (App.state.isNewUser) {
                                App.state.isNewUser = false;
                                App.alert('Silakan tambahkan daftar Madrasah Sasaran KBC Anda.', 'Langkah 2/2', () => {
                                    App.router('sasaran');
                                });
                            } else {
                                App.router('dashboard');
                            }
                        });
                    } else {
                        App.alert(res.error || res.message, 'Gagal');
                    }
                } catch(err) {
                    App.alert('Error di callback saveData: ' + err.message, 'JS Error');
                }
            }).withFailureHandler(err => {
                App.loading(false);
                App.alert(err.message, 'System Error');
            }).saveProfile(payload);
        } catch (e) {
            App.loading(false);
            App.alert('Error di saveData(): ' + e.message, 'JS Error');
        }
    },

    changePassword() {
        try {
            const oldPw = document.getElementById('pw-old').value;
            const newPw = document.getElementById('pw-new').value;
            const confirmPw = document.getElementById('pw-confirm').value;

            if (newPw.length < 6) {
                return App.alert('Password baru minimal 6 karakter.', 'Validasi');
            }
            if (newPw !== confirmPw) {
                return App.alert('Konfirmasi password baru tidak cocok.', 'Validasi');
            }

            App.loading(true, 'Mengubah password...');
            google.script.run.withSuccessHandler(res => {
                App.loading(false);
                if (res.success) {
                    App.alert('Password berhasil diubah.', 'Berhasil', () => {
                        document.getElementById('form-change-password').reset();
                    });
                } else {
                    App.alert(res.error || res.message, 'Gagal');
                }
            }).withFailureHandler(err => {
                App.loading(false);
                App.alert(err.message, 'System Error');
            }).changePassword(App.state.user['NIP'], oldPw, newPw);
        } catch(e) {
            App.loading(false);
            App.alert('Error di changePassword(): ' + e.message, 'JS Error');
        }
    },

    // Data Loaders and Operations
    loadPelatihan() {
        const container = document.getElementById('profile-pelatihan-list');
        if (!container) return;
        container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--color-text-light);">Memuat data...</div>';
        
        google.script.run.withSuccessHandler(res => {
            if (res.success) {
                const list = res.data || [];
                if (list.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--color-text-light); font-size:0.85em;">Belum ada data pelatihan.</div>';
                    return;
                }
                
                let html = '';
                list.forEach(p => {
                    const isSistem = p.sumber === 'sistem';
                    const badgeColor = isSistem ? 'background:#e8f4ff; color:#1890ff;' : 'background:#f6ffed; color:#52c41a;';
                    const deleteBtn = !isSistem ? `<button class="btn" style="background:var(--color-danger); color:white; padding:4px 8px; font-size:0.75rem; border-radius:4px; width:auto !important;" onclick="ProfileManager.deletePelatihan('${p.id}')">Hapus</button>` : '';
                    
                    html += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--color-bg); padding:12px; border-radius:8px; border:1px solid var(--color-border-light);">

                                <div style="font-size:0.8rem; color:var(--color-text-light); margin-bottom:4px;">Penyelenggara: ${p.penyelenggara}</div>
                                <div style="font-size:0.75rem; color:var(--color-text-light);">
                                    📅 ${p.tanggal_mulai} s/d ${p.tanggal_selesai} · <b>Peran: ${p.peran}</b>
                                </div>
                            </div>
                            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
                                <span style="font-size:0.68rem; font-weight:800; border-radius:4px; padding:2px 6px; text-transform:uppercase; ${badgeColor}">${p.sumber}</span>
                                ${deleteBtn}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--color-danger);">${res.error}</div>`;
            }
        }).withFailureHandler(err => {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--color-danger);">${err.message}</div>`;
        }).apiGetProfilPelatihanList(App.state.user['NIP']);
