<script>
// ============================================================
// FORMS VIEW & MANAGER
// Halaman daftar dan pengisian form instrumen pengawasan
// ============================================================

const FormsViews = {
  Main: () => `
    <div class="header no-print">
      <div class="header-title-wrap">
        <div class="header-page-icon">📋</div>
        <h1>Instrumen Pengawasan</h1>
      </div>
      <button class="back-btn" onclick="App.router('dashboard')"><span style="font-size:0.9em;">‹</span> Kembali</button>
    </div>
    <div class="content">
      <!-- Banner Madrasah Sasaran Terpilih -->
      <div id="selected-madrasah-banner" style="display:none; margin-bottom:15px;" class="no-print"></div>

      <!-- Panel: Form tersedia -->
      <div id="panel-forms" class="no-print">
        <div id="forms-list-container">
          <div style="text-align:center;padding:30px;color:#999;">Memuat daftar form...</div>
        </div>
      </div>

      <!-- Panel: Form renderer (saat form sedang diisi) -->
      <div id="panel-form-fill" style="display:none;">
        <div id="form-fill-container"></div>
      </div>
    </div>
  `
};

const FormsManager = {
  state: {
    forms: [],
    history: [],
    currentForm: null,
    selectedMadrasah: null
  },

  init() {
    this.updateSelectedMadrasahBanner();
    this.loadFormsAndHistory();
  },

  updateSelectedMadrasahBanner() {
    const banner = document.getElementById('selected-madrasah-banner');
    if (!banner) return;
    
    const madrasah = this.state.selectedMadrasah;
    if (madrasah && madrasah.nama !== 'Mandiri (Pengawas)') {
      banner.style.display = 'block';
      banner.innerHTML = `
        <div class="card" style="padding: 10px 15px; background: rgba(26,115,232,0.08); border-left: 4px solid var(--color-primary); display: flex; justify-content: space-between; align-items: center; border-radius: 8px; font-size: 0.9em; margin-bottom: 5px;">
          <span style="color:var(--color-text);">Mengisi instrumen untuk: <strong>${madrasah.nama}</strong> <small style="color:var(--color-text-secondary); margin-left: 5px;">(NSM: ${madrasah.nsm})</small></span>
          <button onclick="FormsManager.clearSelectedMadrasah()" style="background: none; border: none; color: var(--color-primary); cursor: pointer; font-weight: bold; font-size: 0.85em; padding: 2px 6px;">Ganti</button>
        </div>
      `;
    } else {
      banner.style.display = 'none';
      banner.innerHTML = '';
    }
  },

  clearSelectedMadrasah() {
    this.state.selectedMadrasah = null;
    this.updateSelectedMadrasahBanner();
  },

  loadFormsAndHistory() {
    App.loading(true, 'Memuat kuesioner...');
    google.script.run
      .withSuccessHandler(formsRes => {
        if (formsRes.success) {
          this.state.forms = formsRes.data || [];
          
          google.script.run
            .withSuccessHandler(histRes => {
              App.loading(false);
              if (histRes.success) {
                this.state.history = histRes.data || [];
                this.renderFormsList();
                
                if (this.pendingFormId) {
                  const fid = this.pendingFormId;
                  this.pendingFormId = null;
                  this.startForm(fid);
                }
              } else {
                this.renderError('Gagal memuat riwayat: ' + histRes.error);
              }
            })
            .withFailureHandler(err => {
              App.loading(false);
              this.renderError('Error riwayat: ' + err.message);
            })
            .apiGetSubmissionHistory(App.state.user['NIP'], null);
        } else {
          App.loading(false);
          this.renderError('Gagal memuat kuesioner: ' + formsRes.error);
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        this.renderError('Error kuesioner: ' + err.message);
      })
      .apiGetAvailableForms();
  },

  renderError(msg) {
    const container = document.getElementById('forms-list-container');
    if (container) {
      container.innerHTML = `<p style="color:#c0392b;text-align:center;">${msg}</p>`;
    }
  },

  toggleAccordion(e, listId, formId) {
    if (e && e.stopPropagation) e.stopPropagation();
    const details = document.getElementById(listId);
    const chevron = document.getElementById(`chevron-${formId}`);
    if (details) {
      const isOpen = details.style.display !== 'none';
      details.style.display = isOpen ? 'none' : 'block';
      if (chevron) {
        chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
      }
    }
  },

  toggleGroupAccordion(e, groupId) {
    if (e && e.stopPropagation) e.stopPropagation();
    const content = document.getElementById(`group-content-${groupId}`);
    const arrow = document.getElementById(`group-arrow-${groupId}`);
    if (content) {
      const isOpen = content.style.display === 'block';
      content.style.display = isOpen ? 'none' : 'block';
      if (arrow) {
        arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
      }
    }
  },

  renderFormsList() {
    const container = document.getElementById('forms-list-container');
    if (!container) return;
    const forms = this.state.forms;
    const history = this.state.history || [];

    if (!forms || forms.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:40px 20px;color:#999;">
          <div style="font-size:3em;margin-bottom:10px;">📭</div>
          <p>Belum ada form instrumen yang tersedia.</p>
        </div>`;
      return;
    }

    // Kelompokkan per group
    const groups = {};
    forms.forEach(f => {
      const g = f.group || 'Lainnya';
      if (!groups[g]) groups[g] = [];
      groups[g].push(f);
    });

    let html = `
      <style>
        .kamad-group-accordion-card {
          margin-bottom: 12px;
          background: var(--color-bg-elevated);
          border: 1px solid var(--color-border);
          border-radius: 10px;
          overflow: hidden;
          box-shadow: var(--shadow-sm);
        }
        .kamad-group-accordion-header {
          padding: 14px 18px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          cursor: pointer;
          background: var(--color-bg-elevated);
          transition: background 0.2s;
          user-select: none;
        }
        .kamad-group-accordion-header:hover {
          background: var(--color-bg-hover);
        }
        .kamad-group-accordion-content {
          display: none;
          padding: 12px 14px 4px 14px;
          border-top: 1px solid var(--color-border-light);
          background: var(--color-bg);
        }
        .kamad-form-card-accordion {
          margin-bottom: 12px;
          background: var(--color-bg-elevated);
          border: 1px solid var(--color-border);
          border-radius: 8px;
          overflow: hidden;
          box-shadow: var(--shadow-sm);
        }
        .kamad-form-card-header {
          padding: 15px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          cursor: pointer;
          transition: background 0.2s;
        }
        .kamad-form-card-header:hover {
          background: var(--color-bg-hover);
        }
        .kamad-form-card-details {
          padding: 15px;
          border-top: 1px solid var(--color-border);
          background: var(--color-bg);
        }
        .kamad-fill-btn-main {
          width: 100%;
          padding: 10px 16px;
          background: var(--color-primary);
          color: white;
          border: none;
          border-radius: 6px;
          font-weight: 600;
          font-size: 0.88rem;
          cursor: pointer;
          transition: background 0.2s;
          text-align: center;
        }
        .kamad-fill-btn-main:hover:not(.disabled) {
          background: #1557b0;
        }
        .kamad-fill-btn-main.disabled {
          background: #ccc;
          color: #666;
          cursor: not-allowed;
        }
        .kamad-history-sub-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 10px 12px;
          margin-top: 6px;
          background: var(--color-bg-elevated);
          border: 1px solid var(--color-border);
          border-radius: 6px;
          font-size: 0.85rem;
          cursor: pointer;
          transition: transform 0.15s, border-color 0.15s;
        }
        .kamad-history-sub-item:hover:not(.disabled) {
          border-color: var(--color-primary);
          transform: translateY(-1px);
        }
        .kamad-history-sub-item.disabled {
          background: rgba(0,0,0,0.02);
          border-color: var(--color-border-light);
          cursor: default;
        }
        @media print {
          body * {
            visibility: hidden;
          }
          #panel-form-fill, #panel-form-fill * {
            visibility: visible;
          }
          #panel-form-fill {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
          }
          .no-print, .no-print * {
            display: none !important;
          }
        }
      </style>
    `;

    let groupIdx = 0;
    Object.keys(groups).sort().forEach(groupName => {
      groupIdx++;
      const groupId = `group-${groupIdx}`;
      const formsInGroup = groups[groupName];

      let totalFilledInGroup = 0;
      formsInGroup.forEach(f => {
        const subCount = history.filter(s => s.formId === f.id).length;
        totalFilledInGroup += subCount;
      });

      html += `
        <div class="kamad-group-accordion-card">
          <div class="kamad-group-accordion-header" onclick="FormsManager.toggleGroupAccordion(event, '${groupId}')">
            <h3 class="kamad-group-accordion-title" style="margin:0; font-size:0.92rem; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:8px;">
              📁 ${groupName}
            </h3>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="kamad-badge-count" style="background:rgba(26,115,232,0.08); color:var(--color-primary); font-weight:700; padding:2px 8px; border-radius:12px; font-size:0.7rem;">
                ${formsInGroup.length} instrumen ${totalFilledInGroup > 0 ? `· ${totalFilledInGroup} isi` : ''}
              </span>
              <span id="group-arrow-${groupId}" style="font-size:0.8rem; color:#999; transition:transform 0.2s; display:inline-block;">▼</span>
            </div>
          </div>
          <div id="group-content-${groupId}" class="kamad-group-accordion-content">
      `;

      formsInGroup.forEach(form => {
        const mySubs = history.filter(s => s.formId === form.id);
        mySubs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        const subCount = mySubs.length;
        const limit = form.submission_limit !== undefined ? parseInt(form.submission_limit) : -1;

        let canFill = true;
        if (limit > 0 && subCount >= limit) {
          canFill = false;
        }

        const listId = `hist-${form.id}`;

        if (limit === 0) {
          const displayBadge = `<span class="kamad-badge kamad-badge-fill">Isi</span>`;
          html += `
            <div class="kamad-form-card-container" style="margin-bottom:10px; background:var(--color-bg-elevated); border:1px solid var(--color-border); border-radius:8px; overflow:hidden;">
              <div class="kamad-form-card"
                   onclick="FormsManager.startForm('${form.id}')"
                   style="margin:0; border:none; border-radius:0; background:transparent; display:flex; align-items:center; justify-content:space-between; padding:15px; cursor:pointer;">
                <div style="display:flex; align-items:center; gap:12px;">
                  <div class="kamad-form-card-icon" style="font-size:1.5rem;">${form.icon || '📋'}</div>
                  <div style="text-align:left;">
                    <div class="kamad-form-card-title" style="font-weight:700;">${form.title}</div>
                    ${form.description ? `<div class="kamad-form-card-desc" style="font-size:0.75rem; color:var(--color-text-secondary);">${form.description}</div>` : ''}
                  </div>
                </div>
                <div>
                  ${displayBadge}
                </div>
              </div>
            </div>`;
        } else {
          const historyList = mySubs.map(s => {
            const dateStr = new Date(s.timestamp).toLocaleDateString('id-ID', {
              day: '2-digit', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });
            
            let label = `📄 Pengisian tanggal ${dateStr}`;
            if (form.requiresMadrasah) {
              const targetMadrasah = (App.state.madrasahSasaran || []).find(m => String(m.nsm).trim() === String(s.nsmMadrasah).trim());
              const madrasahName = targetMadrasah ? targetMadrasah.nama : (s.nsmMadrasah || '-');
              label = `📄 Pengisian [${madrasahName}] tanggal ${dateStr}`;
            }

            return `
              <div class="kamad-history-sub-item" onclick="FormsManager.openForm('${form.id}', { nsm: '${s.nsmMadrasah}', nama: '${form.requiresMadrasah ? '' : 'Mandiri (Pengawas)'}' }, '${s.timestamp}')">
                <span>${label}</span>
                <span style="color:var(--color-primary);font-weight:600;font-size:0.8rem;">Lihat/Cetak &nbsp; &#10095;</span>
              </div>`;
          }).join('');

          const fillBtn = canFill
            ? `<button class="kamad-fill-btn-main" onclick="FormsManager.startForm('${form.id}')">
                 ✏️ Isi Baru (${subCount}/${limit > 0 ? limit : '∞'})
               </button>`
            : `<button class="kamad-fill-btn-main disabled" style="background:#ccc;cursor:not-allowed;color:#666;" disabled>
                 🔒 Batas Pengisian Tercapai (${subCount}/${limit})
               </button>`;

          html += `
            <div class="kamad-form-card-accordion" style="margin-bottom:12px;">
              <div class="kamad-form-card-header" onclick="FormsManager.toggleAccordion(event, '${listId}', '${form.id}')" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
                <div style="display:flex; align-items:flex-start; gap:12px; flex:1; min-width:0;">
                  <div class="kamad-form-card-icon" style="font-size:1.5rem; flex-shrink:0; margin-top:2px;">${form.icon || '📋'}</div>
                  <div style="text-align:left; min-width:0; flex:1;">
                    <div class="kamad-form-card-title" style="font-weight:700; line-height:1.2; word-break:break-word;">${form.title}</div>
                    ${form.description ? `<div class="kamad-form-card-desc" style="font-size:0.75rem; color:var(--color-text-secondary); margin-top:2px; word-break:break-word;">${form.description}</div>` : ''}
                  </div>
                </div>
                <div style="display:flex; align-items:center; gap:8px; padding-left:4px; flex-shrink:0;">
                  <span class="kamad-badge-count" style="background:rgba(26,115,232,0.1); color:var(--color-primary); font-weight:700; padding:2px 8px; border-radius:12px; font-size:0.75rem;">
                    ${subCount} isi
                  </span>
                  <span id="chevron-${form.id}" style="font-size:0.8rem; color:#999; transition: transform 0.2s;">▼</span>
                </div>
              </div>
              
              <div id="${listId}" class="kamad-form-card-details" style="display:none; text-align:left;">
                <div style="margin-bottom:12px;">
                  ${fillBtn}
                </div>
                <div class="kamad-sub-history-list">
                  <div style="font-size:0.78rem; font-weight:600; color:var(--color-text-secondary); margin-bottom:6px;">Daftar Pengisian Lampau:</div>
                  ${historyList || '<div style="color:#999;font-size:0.85em;font-style:italic;">Belum ada pengisian.</div>'}
                </div>
              </div>
            </div>`;
        }
      });

      html += `
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  startForm(formId) {
    const formMeta = this.state.forms.find(f => f.id === formId) || {};
    
    if (formMeta.requiresMadrasah) {
      if (this.state.selectedMadrasah) {
        this.openForm(formId, this.state.selectedMadrasah);
        return;
      }

      const sasaran = App.state.madrasahSasaran || [];

      if (sasaran.length === 0) {
        App.alert('Anda belum memiliki madrasah sasaran KBC. Silakan kelola sasaran terlebih dahulu.', 'Perhatian');
        return;
      }

      if (sasaran.length === 1) {
        this.openForm(formId, sasaran[0]);
      } else {
        this.showMadrasahPicker(formId, sasaran);
      }
    } else {
      this.openForm(formId, { nsm: 'N/A', nama: 'Mandiri (Pengawas)' });
    }
  },

  showMadrasahPicker(formId, sasaranList) {
    const container = document.getElementById('forms-list-container');
    let options = sasaranList.map((m, i) => `
      <div class="card form-card" onclick="FormsManager.openForm('${formId}', ${JSON.stringify(m).replace(/'/g, '&apos;')})"
           style="cursor:pointer;margin-bottom:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;">
        <div style="width:28px;height:28px;background:var(--color-bg-hover);color:var(--color-primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8em;font-weight:bold;">${i+1}</div>
        <div>
          <strong style="display:block;font-size:0.9em;">${m.nama}</strong>
          <small style="color:#888;">NSM: ${m.nsm}</small>
        </div>
      </div>`).join('');

    container.innerHTML = `
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:15px;">
          <button onclick="FormsManager.renderFormsList()" style="background:none;border:none;cursor:pointer;font-size:1.1em;color:var(--color-primary);">← Kembali</button>
          <h3 style="margin:0;">Pilih Madrasah Sasaran KBC</h3>
        </div>
        ${options}
      </div>`;
  },

  openForm(formId, madrasah, submissionId = null) {
    this.state.currentForm = formId;
    if (madrasah && madrasah.nsm) {
      const fullMadrasah = (App.state.madrasahSasaran || []).find(m => String(m.nsm).trim() === String(madrasah.nsm).trim());
      if (fullMadrasah) {
        madrasah = { ...fullMadrasah, ...madrasah };
      }
    }
    const formMeta = this.state.forms.find(f => f.id === formId) || {};
    if (formMeta.requiresMadrasah) {
      this.state.selectedMadrasah = madrasah;
    }
    this.activeMadrasah = madrasah;

    // Hitung subCount untuk validasi limit
    const mySubs = (this.state.history || []).filter(s => s.formId === formId);
    const subCount = mySubs.length;
    const limit = formMeta.submission_limit !== undefined ? parseInt(formMeta.submission_limit) : -1;

    let canFill = false;
    if (submissionId === null) {
      canFill = true;
      if (limit > 0 && subCount >= limit) {
        canFill = false;
      }
    }
    this.currentCanFill = canFill;

    // Tampilkan panel form fill
    document.getElementById('panel-forms').style.display = 'none';
    document.getElementById('panel-form-fill').style.display = '';

    const container = document.getElementById('form-fill-container');
    container.innerHTML = `
      <!-- Back Button: Sleek, high-end floating link -->
      <div style="margin-bottom:16px;" class="no-print">
        <button onclick="FormsManager.cancelForm()" style="background:none;border:none;padding:0;color:var(--color-text-secondary);cursor:pointer;font-size:0.95em;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:color 0.2s;" onmouseover="this.style.color='var(--color-primary)'" onmouseout="this.style.color='var(--color-text-secondary)'">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Kembali ke Daftar Form
        </button>
        ${!canFill && submissionId ? `
          <button onclick="window.focus(); window.print();" class="kamad-print-btn" style="float:right; padding:6px 14px; background:#0f9b58; color:white; border:none; border-radius:18px; font-weight:600; font-size:0.8rem; cursor:pointer; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow-sm); transition:background 0.2s;">
            🖨️ Cetak Jawaban
          </button>
        ` : ''}
      </div>
      
      <!-- Integrated Form Container -->
      <div style="padding:16px 0;margin-bottom:24px;">
        
        <!-- Header Section -->
        <div style="border-bottom:1px solid var(--color-border-light);padding-bottom:20px;margin-bottom:28px;">
          <span style="display:inline-block;margin-bottom:8px;font-size:0.75rem;padding:3px 10px;border-radius:20px;background:rgba(26,115,232,0.12);color:var(--color-primary);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;">
            ${madrasah.nama === 'Mandiri (Pengawas)' ? '🔒 Evaluasi Mandiri Pengawas' : '🏫 Madrasah Sasaran: ' + madrasah.nama}
          </span>
          <h1 style="margin:0;font-size:1.6rem;font-weight:800;color:var(--color-text);line-height:1.25;" id="form-fill-title">
            Memuat form...
          </h1>
          ${!canFill ? `
            <div id="pengawas-doc-id" style="font-size:0.8rem;color:var(--color-text-secondary);margin-top:5px;font-style:italic;"></div>
          ` : ''}
        </div>
        
        <!-- Form Engine Mount Area -->
        <div id="form-engine-mount"></div>
        
        <!-- Action Button (integrated professionally inside form card) -->
        <div id="form-submit-area" class="form-submit-wrapper" style="display:none;">
          <button class="btn btn-primary form-submit-btn" onclick="FormsManager.triggerFormEngineSubmit()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Kirim Formulir
          </button>
        </div>
      </div>
    `;

    // Load form definition dari server
    App.loading(true, 'Memuat form...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          this.renderFormEngine(res.data.yaml, res.data.id, res.data.prefill || {}, canFill, submissionId);
        } else {
          container.innerHTML = `<p style="color:#c0392b;">Gagal memuat form: ${res.error}</p>`;
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        container.innerHTML = `<p style="color:#c0392b;">Error: ${err.message}</p>`;
      })
      .apiGetFormDefinition(formId, App.state.user['NIP'], submissionId);
  },

  renderFormEngine(yamlStr, formId, prefill = {}, canFill = true, submissionId = null) {
    try {
      if (typeof FormEngine === 'undefined') {
        throw new Error('FormEngine belum dimuat. Pastikan js-form-engine.html di-include.');
      }

      // Update title
      const parsed = jsyaml.load(yamlStr);
      const titleEl = document.getElementById('form-fill-title');
      if (titleEl) titleEl.textContent = parsed.title || formId;

      // Mount FormEngine ke container
      const mount = document.getElementById('form-engine-mount');
      if (typeof FormEngine !== 'undefined' && FormEngine.init) {
        FormEngine.init('form-engine-mount', yamlStr, prefill, (data) => {
          if (canFill) FormsManager.submitForm(data);
        }, formId, this.activeMadrasah, { readonly: !canFill });
      } else {
        // Fallback: render manual sederhana
        this.renderFormManual(mount, parsed);
      }

      if (canFill) {
        document.getElementById('form-submit-area').style.display = '';
      } else {
        document.getElementById('form-submit-area').style.display = 'none';
        
        // Hide standard submit button inside mount if any
        const submitBtn = document.querySelector('#form-engine-mount #sf button:not([type="button"])');
        if (submitBtn) submitBtn.style.display = 'none';

        // Nonaktifkan semua input form untuk mode baca saja
        const inputs = document.querySelectorAll('#form-engine-mount input, #form-engine-mount select, #form-engine-mount textarea, #form-engine-mount button');
        inputs.forEach(el => {
          el.disabled = true;
          el.style.pointerEvents = 'none';
          el.style.opacity = '0.85';
        });

        // Tampilkan ID Dokumen untuk pelacakan saat cetak
        const docIdEl = document.getElementById('pengawas-doc-id');
        if (docIdEl && submissionId) {
          const nip = App.state.user['NIP'] || '';
          const tsClean = String(submissionId).replace(/[^a-zA-Z0-9]/g, '');
          const shortTs = tsClean.substring(0, 14); // YYYYMMDDHHMMSS
          docIdEl.innerHTML = `ID Dokumen: <strong>${nip}-${shortTs}</strong>`;
        }
      }
    } catch (e) {
      document.getElementById('form-engine-mount').innerHTML =
        `<p style="color:#c0392b;">Gagal render form: ${e.message}</p>`;
      console.error('FormEngine error:', e);
    }
  },

  triggerFormEngineSubmit() {
    const form = document.getElementById('sf');
    if (form) {
      form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    } else {
      this.submitForm();
    }
  },

  // Fallback renderer manual jika FormEngine tidak tersedia
  renderFormManual(container, parsed) {
    const questions = parsed.questions || [];
    let html = '';

    questions.forEach(q => {
      if (q.type === 'header') {
        html += `<h${q.level || 3} style="color:var(--color-primary);margin:20px 0 8px;">${q.text || ''}</h${q.level || 3}>`;
      } else if (q.type === 'note') {
        html += `<p style="font-size:0.85em;color:#666;margin:2px 0;">${q.label || ''}</p>`;
      } else if (q.type === 'spacer') {
        html += `<div style="height:${q.height || '20px'};${q.line ? 'border-bottom:1px solid var(--color-border);' : ''}"></div>`;
      } else if (q.type === 'text_block') {
        html += `<div style="padding:12px;background:var(--color-bg-elevated);border-radius:8px;margin:10px 0;"><p style="margin:0;font-size:0.85em;color:var(--color-primary);font-weight:bold;">${q.content || ''}</p></div>`;
      } else if (q.type === 'text') {
        html += `<div class="form-group" style="margin-bottom:15px;">
          <label style="display:block;font-size:0.9em;font-weight:600;margin-bottom:5px;">${q.label || ''} ${q.required ? '<span style="color:#e74c3c;">*</span>' : ''}</label>
          <input type="text" name="${q.name}" ${q.readonly ? 'readonly' : ''} ${q.required ? 'required' : ''} class="form-input" style="width:100%;padding:10px;border:1px solid var(--color-border);border-radius:8px;font-size:0.9em;box-sizing:border-box;background:var(--color-bg);">
        </div>`;
      } else if (q.type === 'textarea') {
        html += `<div class="form-group" style="margin-bottom:15px;">
          <label style="display:block;font-size:0.9em;font-weight:600;margin-bottom:5px;">${q.label || ''}</label>
          <textarea name="${q.name}" rows="${q.rows || 3}" placeholder="${q.placeholder || ''}" class="form-input" style="width:100%;padding:10px;border:1px solid var(--color-border);border-radius:8px;font-size:0.9em;box-sizing:border-box;background:var(--color-bg);resize:vertical;"></textarea>
        </div>`;
      } else if (q.type === 'radio') {
        const opts = (q.options || []).map(opt =>
          `<label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;font-size:0.9em;">
            <input type="radio" name="${q.name}" value="${opt}"> ${opt}
          </label>`).join('');
        html += `<div class="form-group" style="margin-bottom:15px;">
          <label style="display:block;font-size:0.9em;font-weight:600;margin-bottom:8px;">${q.label || ''} ${q.required ? '<span style="color:#e74c3c;">*</span>' : ''}</label>
          <div style="padding-left:5px;">${opts}</div>
        </div>`;
      } else if (q.type === 'likert_scale') {
        const opts = (q.options || []).map((opt, i) =>
          `<label style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex:1;text-align:center;">
            <input type="radio" name="${q.name}" value="${opt}">
            <span style="font-size:0.75em;color:#555;">${opt}</span>
          </label>`).join('');
        html += `<div class="form-group" style="margin-bottom:20px;padding:15px;background:var(--color-bg-elevated);border-radius:10px;">
          <p style="font-size:${q.label_size === 'medium' ? '0.9em' : '0.85em'};font-weight:500;margin:0 0 12px;line-height:1.5;">${q.label || ''}</p>
          <div style="display:flex;gap:5px;justify-content:space-between;">${opts}</div>
        </div>`;
      }
    });

    container.innerHTML = `<form id="dynamic-form" style="padding-bottom:20px;">${html}</form>`;
  },

  cancelForm() {
    this.state.currentForm = null;
    this.updateSelectedMadrasahBanner();
    this.loadFormsAndHistory();
    document.getElementById('panel-forms').style.display = '';
    document.getElementById('panel-form-fill').style.display = 'none';
  },

  submitForm(customData) {
    const formId = this.state.currentForm;
    const madrasah = this.activeMadrasah;

    if (!formId || !madrasah) return;

    let formData = {};
    
    if (customData) {
      formData = customData;
    } else {
      const form = document.getElementById('dynamic-form');
      if (form) {
        const inputs = form.querySelectorAll('input:not([type=radio]):not([type=checkbox]), textarea, select');
        inputs.forEach(el => {
          if (el.name) formData[el.name] = el.value;
        });

        const radios = form.querySelectorAll('input[type=radio]:checked');
        radios.forEach(el => {
          if (el.name) formData[el.name] = el.value;
        });

        const checkboxes = form.querySelectorAll('input[type=checkbox]');
        const checkboxGroups = {};
        checkboxes.forEach(el => {
          if (el.name) {
            if (!checkboxGroups[el.name]) checkboxGroups[el.name] = [];
            if (el.checked) checkboxGroups[el.name].push(el.value);
          }
        });
        Object.assign(formData, checkboxGroups);
      } else if (typeof FormEngine !== 'undefined' && FormEngine.data) {
        formData = FormEngine.data;
      }
    }

    const payload = {
      nip: App.state.user['NIP'],
      formId: formId,
      nsmMadrasah: madrasah.nsm,
      data: formData
    };

    App.loading(true, 'Mengirim formulir...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          App.alert(`Form berhasil dikirim! ID: ${res.data.submissionId}`, 'Berhasil');
          this.cancelForm();
        } else {
          App.alert(res.error || 'Gagal mengirim form.', 'Gagal');
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        App.alert(err.message || 'Terjadi kesalahan sistem.', 'Error');
      })
      .apiSubmitForm(payload);
  }
};
</script>
