<script>
// ============================================================
// MATERI VIEW & MANAGER
// Halaman daftar materi KBC & MAGIS
// ============================================================

const MateriViews = {
  Main: () => `
    <div class="header">
      <div class="header-title-wrap">
        <div class="header-page-icon">📚</div>
        <h1>Buku dan Materi Terkait</h1>
      </div>
      <button class="back-btn" onclick="App.router('dashboard')"><span style="font-size:0.9em;">‹</span> Kembali</button>
    </div>
    <div class="content" style="padding-top:16px;">
      <!-- Search Bar -->
      <div style="margin-bottom: 16px; position: sticky; top: 0; background: var(--color-bg); padding-bottom: 10px; z-index: 10;">
        <input type="text" id="search-materi" class="form-control" placeholder="🔍 Cari judul, kelompok, atau sub-materi..." onkeyup="MateriManager.filter(this.value)" style="width: 100%; box-sizing: border-box; padding: 12px 16px; border: 1px solid var(--color-border); border-radius: 10px; font-size: 0.9rem; background: var(--color-bg-elevated); color: var(--color-text); transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'">
      </div>
      <div id="materi-container">
        <!-- Content will be injected here -->
      </div>
    </div>
  `,
  
  Empty: () => `
    <div class="card" style="text-align:center; padding:40px; color:var(--color-text-light);">
        <div style="font-size:3rem; margin-bottom:12px;">📚</div>
        <p style="margin:0; font-size:0.95em;">Belum ada materi yang tersedia saat ini.</p>
    </div>
  `
};

const MateriManager = {
  state: {
    materi: []
  },

  init() {
    this.loadMateri();
  },

  loadMateri() {
    App.loading(true, 'Memuat daftar materi...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          this.state.materi = res.data || [];
          this.render();
        } else {
          document.getElementById('materi-container').innerHTML = 
            `<p style="color:#c0392b;text-align:center;">Gagal memuat materi: ${res.error}</p>`;
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        document.getElementById('materi-container').innerHTML = 
          `<p style="color:#c0392b;text-align:center;">Koneksi terputus: ${err.message || err}</p>`;
      })
      .getMateriList();
  },

  toggleGroup(headerElement) {
    const card = headerElement.closest('.accordion-group-card');
    if (!card) return;
    card.classList.toggle('active');
  },

  toggleSub(headerElement) {
    const item = headerElement.closest('.accordion-sub-item');
    if (!item) return;
    item.classList.toggle('active');
  },

  filter(query) {
    const q = query.toLowerCase().trim();
    const container = document.getElementById('materi-container');
    if (!container) return;

    if (!q) {
      this.render();
      return;
    }

    const filtered = this.state.materi.filter(item => 
      (item.judul || '').toLowerCase().includes(q) ||
      (item.kelompok || '').toLowerCase().includes(q) ||
      (item.subKelompok || '').toLowerCase().includes(q)
    );

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="card" style="text-align:center; padding:40px; color:var(--color-text-light);">
            <div style="font-size:3.5rem; margin-bottom:12px;">🔍</div>
            <p style="margin:0; font-size:0.95em; font-weight:600;">Tidak ditemukan materi yang cocok</p>
            <p style="margin:4px 0 0 0; font-size:0.85rem; color:var(--color-text-secondary);">Coba kata kunci lain.</p>
        </div>
      `;
      return;
    }

    let html = `
      <div class="card" style="padding: 16px 20px;">
        <h3 style="margin: 0 0 16px 0; font-size: 0.85rem; font-weight:700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px;">Hasil Pencarian (${filtered.length})</h3>
        <div class="materi-list-band">
    `;

    filtered.forEach(item => {
      const displayIcon = item.icon || '📄';
      const badgeText = [item.kelompok, item.subKelompok].filter(Boolean).join(' · ');
      html += `
          <div onclick="window.open('${item.link}', '_blank')" class="materi-card-band">
            <div class="materi-card-icon">${displayIcon}</div>
            <div class="materi-card-info">
              <div class="materi-card-title" title="${item.judul}" style="font-weight:600;">${item.judul}</div>
              <div style="font-size:0.75rem; color:var(--color-text-light); margin-top:2px;">${badgeText}</div>
            </div>
            <div class="materi-card-arrow">›</div>
          </div>
      `;
    });

    html += `
        </div>
      </div>
    `;
    container.innerHTML = html;
  },

  render() {
    const container = document.getElementById('materi-container');
    if (!container) return;

    if (this.state.materi.length === 0) {
      container.innerHTML = MateriViews.Empty();
      return;
    }

    // Group by Kelompok and Sub Kelompok (case-insensitive & trimmed)
    const grouped = {};
    this.state.materi.forEach(item => {
      const kel = (item.kelompok || 'Umum').trim();
      const sub = (item.subKelompok || 'Lainnya').trim();
      const subNormalized = sub.toUpperCase();
      
      if (!grouped[kel]) grouped[kel] = {};
      if (!grouped[kel][subNormalized]) {
        grouped[kel][subNormalized] = {
          title: sub || 'Lainnya',
          items: []
        };
      }
      grouped[kel][subNormalized].items.push(item);
    });

    let html = '';

    for (const kelompok in grouped) {
      const subKeys = Object.keys(grouped[kelompok]);
      const hasMultipleSubs = subKeys.length > 1;

      // Render accordion groups as expanded/active by default for better usability
      html += `
        <div class="accordion-group-card active">
          <div class="group-card-header" onclick="MateriManager.toggleGroup(this)">
            <h2 style="margin:0; font-size:1.05rem; font-weight:700; color:var(--color-text); display:flex; align-items:center; gap:8px;">
              <span style="color:var(--color-primary);">📚</span> ${kelompok}
            </h2>
            <span class="group-arrow-icon">▼</span>
          </div>
          <div class="group-card-content">
            <div class="group-card-content-inner" style="padding: 4px 16px 16px 16px;">
      `;
      
      let isFirstSub = true;
      for (const subKey in grouped[kelompok]) {
        const subData = grouped[kelompok][subKey];
        const subTitle = subData.title;
        const items = subData.items;
        
        const marginTop = isFirstSub ? '12px' : '16px';
        isFirstSub = false;

        if (hasMultipleSubs) {
          // Render sub-accordions as expanded/active by default for quick access
          html += `
            <div class="accordion-sub-item active" style="margin-top:${marginTop};">
              <div class="sub-card-header" onclick="MateriManager.toggleSub(this)">
                <span class="sub-header-text">📁 ${subTitle}</span>
                <div class="sub-header-right">
                  <span class="accordion-badge">${items.length} Materi</span>
                  <span class="sub-arrow-icon">▼</span>
                </div>
              </div>
              <div class="sub-card-content">
                <div class="sub-card-content-inner">
                  <div class="materi-list-band">
          `;
          
          items.forEach(item => {
            const displayIcon = item.icon || '📄';
            html += `
                    <div onclick="window.open('${item.link}', '_blank')" class="materi-card-band">
                      <div class="materi-card-icon">${displayIcon}</div>
                      <div class="materi-card-info">
                        <div class="materi-card-title" title="${item.judul}">${item.judul}</div>
                      </div>
                      <div class="materi-card-arrow">›</div>
                    </div>
            `;
          });

          html += `
                  </div>
                </div>
              </div>
            </div>
          `;
        } else {
          // If only one sub-kelompok, render flat section (no accordion arrow/behavior)
          html += `
            <div style="margin-top:${marginTop};">
              ${subTitle !== 'Lainnya' ? `<h3 style="margin:4px 0 10px 4px; font-size:0.85rem; color:var(--color-text-secondary); text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; gap:6px;">📁 ${subTitle}</h3>` : ''}
              <div class="materi-list-band">
          `;

          items.forEach(item => {
            const displayIcon = item.icon || '📄';
            html += `
                <div onclick="window.open('${item.link}', '_blank')" class="materi-card-band">
                  <div class="materi-card-icon">${displayIcon}</div>
                  <div class="materi-card-info">
                    <div class="materi-card-title" title="${item.judul}">${item.judul}</div>
                  </div>
                  <div class="materi-card-arrow">›</div>
                </div>
            `;
          });

          html += `
              </div>
            </div>
          `;
        }
      }
      
      html += `
            </div>
          </div>
        </div>
      `;
    }

    // Add CSS specific to Accordion and Materi Cards
    html += `
      <style>
        /* Card Accordion Kelompok Utama */
        .accordion-group-card {
          margin-bottom: 20px;
          padding: 0 !important;
          overflow: hidden;
          background: var(--color-bg-elevated);
          border-radius: var(--radius-lg);
          border: 1px solid var(--color-border-light);
          box-shadow: var(--shadow-sm);
          transition: all var(--transition-base);
        }
        [data-theme="dark"] .accordion-group-card {
          border-color: #404040;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .accordion-group-card:hover {
          box-shadow: var(--shadow-md);
          border-color: var(--color-border);
        }
        .group-card-header {
          background: var(--color-bg-elevated);
          padding: 16px 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          cursor: pointer;
          user-select: none;
          transition: background-color var(--transition-fast);
        }
        [data-theme="dark"] .group-card-header {
          background: #1e1e1e;
        }
        .group-card-header:hover {
          background-color: var(--color-bg-hover);
        }
        .group-arrow-icon {
          font-size: 0.8rem;
          color: var(--color-text-secondary);
          transition: transform var(--transition-base);
          display: inline-block;
        }
        .accordion-group-card.active .group-arrow-icon {
          transform: rotate(180deg);
        }
        .group-card-content {
          display: grid;
          grid-template-rows: 0fr;
          transition: grid-template-rows var(--transition-base) ease-in-out;
          background: var(--color-bg-elevated);
          border-top: 0 solid var(--color-border-light);
        }
        [data-theme="dark"] .group-card-content {
          background: #1e1e1e;
        }
        .accordion-group-card.active .group-card-content {
          grid-template-rows: 1fr;
          border-top-width: 1px;
        }
        .group-card-content-inner {
          min-height: 0;
          overflow: hidden;
        }

        /* Accordion Sub-Kelompok (Hanya jika > 1) */
        .accordion-sub-item {
          border: 1px solid var(--color-border-light);
          border-radius: var(--radius-md);
          overflow: hidden;
          background: var(--color-bg);
          transition: all var(--transition-fast);
        }
        [data-theme="dark"] .accordion-sub-item {
          border-color: #2c2c2c;
          background: #141414;
        }
        .sub-card-header {
          padding: 12px 16px;
          background: var(--color-bg-hover);
          display: flex;
          justify-content: space-between;
          align-items: center;
          cursor: pointer;
          user-select: none;
          transition: background-color var(--transition-fast);
        }
        [data-theme="dark"] .sub-card-header {
          background: #222222;
        }
        .sub-card-header:hover {
          background-color: rgba(0, 0, 0, 0.05);
        }
        [data-theme="dark"] .sub-card-header:hover {
          background-color: rgba(255, 255, 255, 0.05);
        }
        .sub-header-text {
          font-weight: 600;
          font-size: 0.85rem;
          color: var(--color-text-secondary);
          text-transform: uppercase;
          letter-spacing: 0.5px;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .sub-header-right {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .sub-arrow-icon {
          font-size: 0.75rem;
          color: var(--color-text-secondary);
          transition: transform var(--transition-base);
          display: inline-block;
        }
        .accordion-sub-item.active .sub-arrow-icon {
          transform: rotate(180deg);
        }
        .sub-card-content {
          display: grid;
          grid-template-rows: 0fr;
          transition: grid-template-rows var(--transition-base) ease-in-out;
        }
        .accordion-sub-item.active .sub-card-content {
          grid-template-rows: 1fr;
        }
        .sub-card-content-inner {
          min-height: 0;
          overflow: hidden;
          background: var(--color-bg-elevated);
        }

        /* Materi List Band (Baris Tanpa Kotak) */
        .materi-list-band {
          display: flex;
          flex-direction: column;
          background: var(--color-bg-elevated);
          border-radius: var(--radius-md);
          overflow: hidden;
        }
        [data-theme="dark"] .materi-list-band {
          background: #1e1e1e;
        }

        .materi-card-band {
          padding: 12px 16px;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 14px;
          transition: all var(--transition-fast);
          border-bottom: 1px solid var(--color-border-light);
          background: transparent;
        }
        [data-theme="dark"] .materi-card-band {
          border-bottom-color: #2c2c2c;
        }
        .materi-card-band:last-child {
          border-bottom: none;
        }
        .materi-card-band:hover {
          background: var(--color-bg-hover) !important;
          padding-left: 20px; /* Micro animation slide */
        }
        [data-theme="dark"] .materi-card-band:hover {
          background: #2a2a2a !important;
        }
        .materi-card-icon {
          width: 32px;
          height: 32px;
          border-radius: 6px;
          background: rgba(26,115,232,0.08);
          color: var(--color-primary);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.1rem;
          flex-shrink: 0;
          transition: all var(--transition-fast);
        }
        [data-theme="dark"] .materi-card-icon {
          background: rgba(66, 133, 244, 0.15);
          color: #669df6;
        }
        .materi-card-band:hover .materi-card-icon {
          background: var(--color-primary);
          color: white;
        }
        [data-theme="dark"] .materi-card-band:hover .materi-card-icon {
          background: #4285f4;
          color: #ffffff;
        }
        .materi-card-info {
          flex: 1;
          min-width: 0;
        }
        .materi-card-title {
          font-weight: 500;
          font-size: 0.9rem;
          color: var(--color-text);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .materi-card-arrow {
          font-size: 1.25rem;
          color: var(--color-text-light);
          transition: transform var(--transition-fast), color var(--transition-fast);
          margin-left: auto;
          font-weight: 300;
          line-height: 1;
        }
        .materi-card-band:hover .materi-card-arrow {
          color: var(--color-primary);
          transform: translateX(3px);
        }
        [data-theme="dark"] .materi-card-band:hover .materi-card-arrow {
          color: #669df6;
        }

        @media (max-width: 600px) {
          .materi-card-band {
            padding: 10px 12px;
            gap: 10px;
          }
          .materi-card-icon {
            width: 28px;
            height: 28px;
            font-size: 0.95rem;
          }
          .materi-card-arrow {
            font-size: 1.1rem;
          }
        }
      </style>
    `;

    container.innerHTML = html;
  }
};
</script>
