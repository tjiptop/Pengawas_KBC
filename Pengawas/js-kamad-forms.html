<script>
// ============================================================
// KAMAD FORMS MODULE
// Daftar form dan pengisian form untuk Kepala Madrasah
// Form dengan allowed_roles: [kamad] → bisa diisi
// Form lain → read-only / tidak tampil
// ============================================================

const KamadForms = {

  state: {
    forms:       [],   // Semua form tersedia untuk kamad
    history:     [],   // Riwayat pengisian
    activeTab:   'forms',
    currentForm: null, // { id, yaml, meta }
  },

  // --------------------------------------------------------
  // VIEWS
  // --------------------------------------------------------

  views: {

    /**
     * Layout utama halaman form
     */
    main: () => `
      <div class="header no-print">
        <div style="display:flex;align-items:center;gap:4px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="header-page-icon">📋</div>
            <div>
              <div style="display:flex;align-items:center;gap:6px;">
                <h1 id="kamad-forms-header-title" style="margin:0;font-size:0.95rem;line-height:1.2;font-weight:700;">Form Instrumen</h1>
                ${!!App.state.isSupervisorViewAs ? `
                  <span style="background:rgba(239,68,68,0.1); color:var(--color-danger); font-size:0.65rem; font-weight:700; padding:1px 6px; border-radius:4px; display:inline-flex; align-items:center; gap:2px; height:16px;" title="Anda sedang masuk menggunakan hak akses Pengawas">
                    👁️ PENGAWAS
                  </span>` : ''}
              </div>
              <div style="font-size:0.7rem;color:var(--color-text-secondary);opacity:0.85;">${App.state.kamad?.madrasah_name || 'Madrasah Anda'}</div>
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="back-btn no-print" onclick="KamadForms.loadFormsAndHistory(true)" style="padding:4px 10px; font-size:1rem; display:flex; align-items:center; justify-content:center; width:34px;" title="Refresh Data">🔄</button>
          <button class="back-btn no-print" onclick="KamadForms.closePage()"><span style="font-size:0.9em;">‹</span> Kembali</button>
        </div>
      </div>

      <div class="content">
        <!-- Panel List Form -->
        <div id="kpanel-list">
          <div id="kforms-list">
            <div class="kamad-loading-text">Memuat daftar instrumen...</div>
          </div>
        </div>

        <!-- Panel Pengisian/Detail Form -->
        <div id="kpanel-fill" style="display:none;">
          <div id="kform-fill-area"></div>
        </div>
      </div>
    `,

    /**
     * Daftar form dikelompokkan per group
     */
    formsList: (forms, history) => {
      const isSupervisor = !!App.state.isSupervisorViewAs;
      const nsm = App.state.kamad?.nsm || '';

      if (!forms || !forms.length) {
        return `<div class="kamad-empty-state">
          <div class="kamad-empty-icon">📭</div>
          <p>Belum ada form yang tersedia untuk Anda.</p>
        </div>`;
      }

      // Group per group
      const groups = {};
      forms.forEach(f => {
        const g = f.group || 'Lainnya';
        if (!groups[g]) groups[g] = [];
        groups[g].push(f);
      });

      let html = `
        <style>
          .kamad-form-card-accordion {
            margin-bottom: 12px;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
          }
          .kamad-form-card-header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
          }
          .kamad-form-card-header:hover {
            background: var(--color-bg-hover);
          }
          .kamad-form-card-details {
            padding: 15px;
            border-top: 1px solid var(--color-border);
            background: var(--color-bg);
          }
          .kamad-fill-btn-main {
            width: 100%;
            padding: 10px 16px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
          }
          .kamad-fill-btn-main:hover:not(.disabled) {
            background: #1557b0;
          }
          .kamad-fill-btn-main.disabled {
            background: #ccc;
            color: #666;
            cursor: not-allowed;
          }
          .kamad-history-sub-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-top: 6px;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
          }
          .kamad-history-sub-item:hover:not(.disabled) {
            border-color: var(--color-primary);
            transform: translateY(-1px);
          }
          .kamad-history-sub-item.disabled {
            background: rgba(0,0,0,0.02);
            border-color: var(--color-border-light);
            cursor: default;
          }
          .kamad-group-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-secondary);
            margin: 18px 0 8px 0;
            padding-left: 2px;
          }
        </style>
      `;

      Object.keys(groups).sort().forEach(groupName => {
        html += `<div class="kamad-group-label">${groupName}</div>`;
        groups[groupName].forEach(form => {
          const mySubs = (history || []).filter(s => s.form_id === form.id);
          mySubs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          const subCount = mySubs.length;
          const limit = form.submission_limit !== undefined ? parseInt(form.submission_limit) : -1;
          
          let canFill = form.canFill;
          if (canFill && limit > 0 && subCount >= limit) {
            canFill = false;
          }

          const isListOnly = !canFill && form.subordinate_visibility === 'list';

          const badge = canFill
            ? `<span class="kamad-badge kamad-badge-fill">Isi</span>`
            : `<span class="kamad-badge kamad-badge-readonly">${isListOnly ? 'Riwayat' : 'Lihat'}</span>`;

          const myActiveTokens = (KamadForms.state.my_tokens || []).filter(t => t.form_id === form.id);
          const hasActiveDelegation = myActiveTokens.some(t => {
            const isExpired = new Date(t.expires_at) < new Date();
            const isExhausted = t.max_usages > 0 && t.current_usages >= t.max_usages;
            return t.status !== 'CLOSED' && !isExpired && !isExhausted;
          });

          const delegasiBtn = form.enable_delegation
            ? (hasActiveDelegation
              ? `<span style="cursor:not-allowed;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;margin-right:2px;opacity:0.4;user-select:none;font-size:1.15rem;" title="Active delegation exists">
                   ⚡
                 </span>`
              : `<span style="cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;margin-right:2px;user-select:none;font-size:1.15rem;" onclick="if (window.event) window.event.stopPropagation(); DelegateManager.showModal('${form.id}', '${nsm}')" title="Create delegation link">
                   ⚡
                 </span>`)
            : '';

          const usernameForActiveList = isSupervisor ? App.state.user?.username : nsm;
          const activeLinksHtml = (typeof DelegateManager !== 'undefined')
            ? DelegateManager.renderActiveLinksList(myActiveTokens, usernameForActiveList, form.id, nsm)
            : '';
          const activeLinksSection = (form.enable_delegation && activeLinksHtml && !activeLinksHtml.includes('Belum ada link aktif'))
            ? `<div style="background:var(--color-bg); padding:10px; border-top:1px solid var(--color-border);" onclick="if (window.event) window.event.stopPropagation();">${activeLinksHtml}</div>`
            : '';

          const listId = `hist-${form.id}`;

          if (limit === 0 && !isListOnly) {
            html += `
              <div class="kamad-form-card-container" style="margin-bottom:10px; background:var(--color-bg-elevated); border:1px solid var(--color-border); border-radius:8px; overflow:hidden;">
                <div class="kamad-form-card ${canFill ? '' : 'kamad-form-card-readonly'}"
                     onclick="KamadForms.open('${form.id}')"
                     style="margin:0; border:none; border-radius:0; background:transparent;">
                  <div class="kamad-form-card-icon">${form.icon || '📋'}</div>
                  <div class="kamad-form-card-body" style="text-align:left;">
                    <div class="kamad-form-card-title" style="font-weight:700;">${form.title}</div>
                    ${form.description ? `<div class="kamad-form-card-desc" style="font-size:0.75rem; color:var(--color-text-secondary);">${form.description}</div>` : ''}
                  </div>
                  <div style="display:flex;align-items:center;" onclick="if (window.event) window.event.stopPropagation();">
                    ${delegasiBtn}
                    <div onclick="KamadForms.open('${form.id}')">
                      ${badge}
                    </div>
                  </div>
                </div>
                ${activeLinksSection}
              </div>`;
          } else {
            const historyList = mySubs.map(s => {
              const dateStr = new Date(s.timestamp).toLocaleDateString('id-ID', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
              });
              if (isListOnly) {
                return `
                  <div class="kamad-history-sub-item disabled" onclick="event.stopPropagation();">
                    <span>📄 Pengisian tanggal ${dateStr}</span>
                    <span style="color:var(--color-text-light);font-size:0.8rem;display:inline-flex;align-items:center;gap:4px;">🔒 Detail Terkunci</span>
                  </div>`;
              } else {
                return `
                  <div class="kamad-history-sub-item" onclick="KamadForms.open('${form.id}', '${s.timestamp}')">
                    <span>📄 Pengisian tanggal ${dateStr}</span>
                    <span style="color:var(--color-primary);font-weight:600;font-size:0.8rem;">Lihat/Cetak &nbsp; &#10095;</span>
                  </div>`;
              }
            }).join('');

            const fillBtn = isListOnly
              ? `<button class="kamad-fill-btn-main disabled" style="background:rgba(0,0,0,0.03);border:1px dashed var(--color-border);cursor:not-allowed;color:var(--color-text-secondary);" disabled>
                   🔒 Pengisian Khusus Pengawas Binaan
                 </button>`
              : (canFill
                ? `<button class="kamad-fill-btn-main" onclick="KamadForms.open('${form.id}')">
                     ✏️ Isi Baru (${subCount}/${limit > 0 ? limit : '∞'})
                   </button>`
                : `<button class="kamad-fill-btn-main disabled" style="background:#ccc;cursor:not-allowed;color:#666;" disabled>
                     🔒 Batas Pengisian Tercapai (${subCount}/${limit})
                   </button>`);

            html += `
              <div class="kamad-form-card-accordion" style="margin-bottom:12px;">
                <div class="kamad-form-card-header" onclick="KamadForms.toggleAccordion(event, '${listId}', '${form.id}')">
                  <div style="display:flex; align-items:center; gap:12px;">
                    <div class="kamad-form-card-icon" style="font-size:1.5rem;">${form.icon || '📋'}</div>
                    <div style="text-align:left;">
                      <div class="kamad-form-card-title" style="font-weight:700;">${form.title}</div>
                      ${form.description ? `<div class="kamad-form-card-desc" style="font-size:0.75rem; color:var(--color-text-secondary);">${form.description}</div>` : ''}
                    </div>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <span class="kamad-badge-count" style="background:rgba(26,115,232,0.1); color:var(--color-primary); font-weight:700; padding:2px 8px; border-radius:12px; font-size:0.75rem;">
                      ${subCount} isi
                    </span>
                    <span id="chevron-${form.id}" style="font-size:0.8rem; color:#999; transition: transform 0.2s;">▼</span>
                  </div>
                </div>
                
                <div id="${listId}" class="kamad-form-card-details" style="display:none; text-align:left;">
                  <div style="margin-bottom:12px;">
                    ${fillBtn}
                  </div>
                  ${activeLinksSection ? `<div style="margin-bottom:12px; border:1px solid var(--color-border); border-radius:4px; padding:8px; background:var(--color-bg-elevated);">${activeLinksSection}</div>` : ''}
                  <div class="kamad-sub-history-list">
                    <div style="font-size:0.78rem; font-weight:600; color:var(--color-text-secondary); margin-bottom:6px;">Daftar Pengisian Lampau:</div>
                    ${historyList || '<div style="color:#999;font-size:0.85em;font-style:italic;">Belum ada pengisian.</div>'}
                  </div>
                </div>
              </div>`;
          }
        });
      });

      return html;
    },

    /**
     * Area pengisian form
     */
    fillArea: (formMeta, canFill) => `
      <style>
        .kamad-print-btn:hover {
          background: #0a7a45 !important;
        }
        @media print {
          .no-print, .kamad-back-inline, .kamad-form-header-badge, .kamad-print-btn, .kamad-header, .header, .back-btn {
            display: none !important;
          }
          body {
            background: white !important;
            color: black !important;
            padding: 0 !important;
            margin: 0 !important;
          }
          .content {
            padding: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
            border: none !important;
          }
          #kfill-engine {
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
          }
          .print-only-block {
            display: block !important;
            position: absolute !important;
            top: 10px !important;
            right: 15px !important;
            font-size: 0.75rem !important;
            color: #555 !important;
            font-family: monospace !important;
            text-align: right !important;
          }
        }
      </style>
      <div id="kamad-doc-id" class="print-only-block" style="display:none;"></div>
      
      <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;" class="no-print">
        <button onclick="KamadForms.closeFill()"
          class="kamad-back-inline">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Kembali
        </button>
        ${canFill ? '' : `
          <button onclick="window.print()" class="kamad-print-btn" style="padding:6px 14px; background:#0f9b58; color:white; border:none; border-radius:18px; font-weight:600; font-size:0.8rem; cursor:pointer; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow-sm); transition:background 0.2s;">
            🖨️ Cetak Form
          </button>
        `}
      </div>

      <div class="kamad-form-header">
        <span class="kamad-form-header-badge ${canFill ? '' : 'kamad-badge-readonly'}">
          ${canFill ? '✏️ Mode Pengisian' : '👁️ Mode Baca'}
        </span>
        <h1 id="kfill-title" class="kamad-form-fill-title">Memuat...</h1>
      </div>

      <div id="kfill-engine"></div>
    `,
  },

  // --------------------------------------------------------
  // LIFECYCLE
  // --------------------------------------------------------

  init() {
    const el = document.getElementById('app');
    el.innerHTML = KamadForms.views.main();
    this.loadFormsAndHistory();
  },

  // --------------------------------------------------------
  // ROUTING & ACCORDION
  // --------------------------------------------------------

  closePage() {
    App.router('kamad-dashboard');
  },

  toggleAccordion(e, listId, formId) {
    if (e && e.stopPropagation) e.stopPropagation();
    const details = document.getElementById(listId);
    const chevron = document.getElementById(`chevron-${formId}`);
    if (details) {
      const isOpen = details.style.display !== 'none';
      details.style.display = isOpen ? 'none' : 'block';
      if (chevron) {
        chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
      }
    }
  },

  // --------------------------------------------------------
  // DATA LOADING
  // --------------------------------------------------------

  loadFormsAndHistory(forceRefresh = false) {
    const nsm = App.state.kamad?.nsm;
    if (!nsm) return;

    if (!forceRefresh && App.state.kamadForms && App.state.kamadForms.length > 0) {
      this.state.forms = App.state.kamadForms;
      this.state.history = App.state.kamadHistory || [];
      this.state.my_tokens = App.state.my_tokens || [];
      const listEl = document.getElementById('kforms-list');
      if (listEl) {
        listEl.innerHTML = KamadForms.views.formsList(this.state.forms, this.state.history);
      }
      return;
    }

    App.loading(true, 'Memuat kuesioner...');
    const viewerRole = App.state.isSupervisorViewAs ? 'district' : 'madrasah';

    google.script.run
      .withSuccessHandler(resForms => {
        if (resForms.success) {
          this.state.forms = resForms.data || [];
          App.state.kamadForms = this.state.forms;
          
          google.script.run
            .withSuccessHandler(resHist => {
              App.loading(false);
              if (resHist.success) {
                this.state.history = resHist.data || [];
                App.state.kamadHistory = this.state.history;
                this.state.my_tokens = App.state.my_tokens || [];
                
                const listEl = document.getElementById('kforms-list');
                if (listEl) {
                  listEl.innerHTML = KamadForms.views.formsList(this.state.forms, this.state.history);
                }
                if (forceRefresh) App.toast('Daftar instrumen diperbarui');
              } else {
                this.showError('Gagal memuat riwayat: ' + resHist.error);
              }
            })
            .withFailureHandler(() => {
              App.loading(false);
              this.showError('Koneksi terputus saat memuat riwayat.');
            })
            .kamadGetSubmissionHistory(nsm);
        } else {
          App.loading(false);
          this.showError('Gagal memuat kuesioner: ' + resForms.error);
        }
      })
      .withFailureHandler(() => {
        App.loading(false);
        this.showError('Koneksi terputus saat memuat kuesioner.');
      })
      .kamadGetAvailableForms(nsm, viewerRole);
  },

  showError(msg) {
    const listEl = document.getElementById('kforms-list');
    if (listEl) {
      listEl.innerHTML = `<p class="kamad-error-inline">${msg}</p>`;
    }
  },

  // --------------------------------------------------------
  // FORM FILL
  // --------------------------------------------------------

  open(formId, submissionId = null) {
    this.state.currentSubmissionId = submissionId;
    const formMeta = (App.state.kamadForms || []).find(f => f.id === formId) || { id: formId };
    
    // Blokir jika pengguna adalah bawahan yang dibatasi subordinate_visibility: list
    const isListOnly = !formMeta.canFill && formMeta.subordinate_visibility === 'list';
    if (submissionId && isListOnly) {
      alert("Maaf, detail isian ini hanya dapat diakses oleh Pengawas Binaan.");
      return;
    }

    const subCount = (this.state.history || []).filter(s => s.form_id === formId).length;
    const limit = formMeta.submission_limit !== undefined ? parseInt(formMeta.submission_limit) : -1;
    
    let canFill = false;
    if (submissionId === null) {
      canFill = formMeta.canFill !== false;
      if (canFill && limit > 0 && subCount >= limit) {
        canFill = false;
      }
    }

    // Tampilkan panel fill
    const panelList = document.getElementById('kpanel-list');
    const panelFill = document.getElementById('kpanel-fill');
    if (panelList) panelList.style.display = 'none';
    if (panelFill) panelFill.style.display = '';

    const fillArea = document.getElementById('kform-fill-area');
    fillArea.innerHTML = KamadForms.views.fillArea(formMeta, canFill);

    this.state.currentForm = { id: formId, canFill };

    const titleEl = document.getElementById('kamad-forms-header-title');
    if (titleEl) {
      titleEl.textContent = submissionId ? 'Detail Form' : 'Pengisian Form';
    }

    // Fetch YAML definisi form & prefill data
    App.loading(true, 'Memuat form...');
    const nsm = App.state.kamad?.nsm;
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          this._renderFormEngine(res.data.yaml, formId, canFill, res.data.prefill || {});
        } else {
          document.getElementById('kfill-engine').innerHTML =
            `<p class="kamad-error-inline">Gagal memuat form: ${res.error}</p>`;
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        document.getElementById('kfill-engine').innerHTML =
          `<p class="kamad-error-inline">Koneksi terputus: ${err.message || err}</p>`;
      })
      .kamadGetFormDefinition(formId, nsm, submissionId);
  },

  _renderFormEngine(yamlStr, formId, canFill, prefillData = {}) {
    try {
      const parsed = jsyaml.load(yamlStr);
      const titleEl = document.getElementById('kfill-title');
      if (titleEl) titleEl.textContent = parsed.title || formId;

      const mountEl = document.getElementById('kfill-engine');
      const info = App.state.kamad?.madrasahInfo || {};
      const madrasah = {
        madrasah_id:  App.state.kamad?.nsm || '',
        nsm:          App.state.kamad?.nsm || '',
        name:         info.nama || App.state.kamad?.madrasah_name || '',
        level:        info.jenjang || '',
        province:     info.provinsi || '',
        district:     info.kabupaten || '',
        subdistrict:  info.kecamatan || ''
      };

      if (typeof FormEngine !== 'undefined' && FormEngine.init) {
        FormEngine.init('kfill-engine', yamlStr, prefillData, (data) => {
          if (canFill) KamadForms.submitForm(data);
        }, formId, madrasah, { readonly: !canFill });
      }

      // Sembunyikan tombol submit bawaan jika readonly, serta disable input
      if (!canFill) {
        const submitBtn = document.querySelector('#kfill-engine #sf button:not([type="button"])');
        if (submitBtn) submitBtn.style.display = 'none';
        
        // Nonaktifkan semua input form untuk mode baca saja
        const inputs = document.querySelectorAll('#kfill-engine input, #kfill-engine select, #kfill-engine textarea, #kfill-engine button');
        inputs.forEach(el => {
          el.disabled = true;
          el.style.pointerEvents = 'none';
          el.style.opacity = '0.85';
        });

        // Tampilkan ID Dokumen untuk pelacakan saat cetak
        const docIdEl = document.getElementById('kamad-doc-id');
        if (docIdEl && KamadForms.state.currentSubmissionId) {
          const nsm = App.state.kamad?.nsm || '';
          const tsClean = String(KamadForms.state.currentSubmissionId).replace(/[^a-zA-Z0-9]/g, '');
          const shortTs = tsClean.substring(0, 14); // YYYYMMDDHHMMSS
          docIdEl.innerHTML = `ID Dokumen: <strong>${nsm}-${shortTs}</strong>`;
        }
      }
    } catch (e) {
      document.getElementById('kfill-engine').innerHTML =
        `<p class="kamad-error-inline">Error render form: ${e.message}</p>`;
    }
  },

  triggerSubmit() {
    const form = document.getElementById('sf');
    if (form) {
      form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }
  },

  submitForm(data) {
    const { id: formId } = this.state.currentForm;
    const nsm = App.state.kamad?.nsm;

    const payload = {
      nsm:    nsm,
      formId: formId,
      data:   data,
      role:   App.state.isSupervisorViewAs ? 'district' : 'madrasah'
    };

    App.loading(true, 'Mengirim formulir...');
    google.script.run
      .withSuccessHandler(res => {
        App.loading(false);
        if (res.success) {
          // Perbarui memori lokal tanpa reload server
          const newSubmission = {
            form_id: formId,
            timestamp: res.data?.timestamp || new Date().toISOString(),
            status: 'final'
          };
          App.state.kamadHistory = App.state.kamadHistory || [];
          App.state.kamadHistory.push(newSubmission);
          this.state.history = App.state.kamadHistory;
          
          App.alert(`Form berhasil dikirim!`, 'Berhasil');
          this.closeFill();
        } else {
          App.alert(res.error || 'Gagal mengirim form.', 'Gagal');
        }
      })
      .withFailureHandler(err => {
        App.loading(false);
        App.alert('Koneksi terputus: ' + (err.message || err), 'Error');
      })
      .kamadSubmitForm(payload);
  },

  closeFill() {
    this.state.currentForm = null;
    const panelFill = document.getElementById('kpanel-fill');
    const panelList = document.getElementById('kpanel-list');
    if (panelFill) panelFill.style.display = 'none';
    if (panelList) panelList.style.display = '';
    
    const titleEl = document.getElementById('kamad-forms-header-title');
    if (titleEl) {
      titleEl.textContent = 'Form Instrumen';
    }
    this.loadFormsAndHistory(false);
  }
};
</script>
